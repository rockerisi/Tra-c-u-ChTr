/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tiếp tục đổi mới, hoàn thiện phương thức lãnh đạo, cầm quyền của Đảng trong kỷ nguyên mới, Đảng ủy Quốc hội và Đảng ủy Chính phủ thực hiện nhiệm vụ theo nguyên tắc nào?","opts":{"A":"Chỉ đạo các tổ chức chính trị - xã hội.","B":"Thay thế nhiệm vụ của các tỉnh ủy, thành ủy.","C":"Đúng chức năng, thẩm quyền được giao.","D":"Trực tiếp kiểm tra tất cả cơ sở."},"ans":"C","s":"Đảng ủy Quốc hội và Đảng ủy Chính phủ thực hiện nhiệm vụ theo nguyên tắc nào?","ref":""},{"doc":"NQ 29","n":49,"q":"Theo Nghị quyết số 29-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tiếp tục đổi mới, hoàn thiện phương thức lãnh đạo, cầm quyền của Đảng trong kỷ nguyên mới, các ban của Đảng ở Trung ương có trách nhiệm gì?","opts":{"A":"Chỉ tuyên truyền, phổ biến Nghị quyết.","B":"Thay thế các cấp ủy tổ chức thực hiện.","C":"Chỉ tổng hợp báo cáo kết quả hằng năm.","D":"Tham mưu, giúp việc và hướng dẫn triển khai theo chức năng."},"ans":"D","s":"Các ban của Đảng ở Trung ương có trách nhiệm gì?","ref":""},{"doc":"NQ 29","n":50,"q":"Theo Nghị quyết số 29-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tiếp tục đổi mới, hoàn thiện phương thức lãnh đạo, cầm quyền của Đảng trong kỷ nguyên mới, khi phát hiện nội dung không còn phù hợp trong quá trình thực hiện, các cấp ủy cần làm gì?","opts":{"A":"Tiếp tục thực hiện để bảo đảm thống nhất.","B":"Kịp thời đề xuất sửa đổi, bổ sung hoặc thay thế.","C":"Tự ý bỏ qua quy định hiện hành.","D":"Chờ hết nhiệm kỳ mới tổng kết, điều chỉnh."},"ans":"B","s":"Khi phát hiện nội dung không còn phù hợp trong quá trình thực hiện, các cấp ủy cần làm gì?","ref":""},{"doc":"NQ 30","n":1,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, vị trí của cán bộ và công tác cán bộ được xác định như thế nào?","opts":{"A":"Cán bộ là lực lượng nòng cốt quyết định chất lượng tổ chức; công tác cán bộ là khâu trọng yếu trong xây dựng hệ thống chính trị.","B":"Cán bộ là nhân tố trung tâm của công tác xây dựng Đảng; công tác cán bộ là khâu đột phá quyết định hiệu quả tổ chức thực hiện.","C":"Cán bộ là nhân tố quyết định sự thành bại của cách mạng; công tác cán bộ là then chốt của then chốt.","D":"Cán bộ là nguồn lực đặc biệt quan trọng của Đảng; công tác cán bộ là nền tảng trực tiếp của năng lực lãnh đạo và sức chiến đấu."},"ans":"C","s":"Vị trí của cán bộ và công tác cán bộ được xác định như thế nào?","ref":""},{"doc":"NQ 30","n":2,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, công tác cán bộ phải tuân thủ nguyên tắc lãnh đạo và tổ chức thực hiện nào?","opts":{"A":"Đảng thống nhất định hướng công tác cán bộ, cấp ủy các cấp quyết định theo phân cấp và chịu trách nhiệm toàn diện về đội ngũ thuộc quyền.","B":"Thực hiện tập trung dân chủ, phân cấp rõ thẩm quyền, đề cao trách nhiệm người đứng đầu và tăng cường kiểm soát quyền lực.","C":"Bảo đảm sự lãnh đạo của cấp ủy, phát huy vai trò cơ quan tham mưu, thực hiện tập thể lãnh đạo gắn với trách nhiệm cá nhân.","D":"Đảng thống nhất lãnh đạo trực tiếp, toàn diện công tác cán bộ và quản lý đội ngũ cán bộ; thực hiện nghiêm nguyên tắc tập trung dân chủ."},"ans":"D","s":"Công tác cán bộ phải tuân thủ nguyên tắc lãnh đạo và tổ chức thực hiện nào?","ref":""},{"doc":"NQ 30","n":3,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, đâu là giá trị cốt lõi trong xây dựng cán bộ?","opts":{"A":"Bản lĩnh chính trị vững vàng, đạo đức trong sáng, ý thức tổ chức kỷ luật và tinh thần dám chịu trách nhiệm vì lợi ích chung.","B":"Sự trung thành với Đảng, Tổ quốc, Nhân dân, tinh thần phụng sự Tổ quốc, phục vụ Nhân dân.","C":"Tận tụy với công việc, gần dân, trọng dân, có khát vọng cống hiến và năng lực tạo chuyển biến trong thực tiễn.","D":"Liêm chính, công tâm, khách quan, giữ gìn uy tín và đặt lợi ích của Đảng, Nhà nước, Nhân dân lên trên lợi ích cá nhân."},"ans":"B","s":"Đâu là giá trị cốt lõi trong xây dựng cán bộ?","ref":""},{"doc":"NQ 30","n":4,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, mối quan hệ giữa đức, thực tài và thước đo cán bộ được xác định như thế nào?","opts":{"A":"Đức là nền tảng, năng lực là trọng tâm, kết quả thực hiện nhiệm vụ và uy tín là thước đo chủ yếu.","B":"Đức là gốc, thực tài là trọng, sản phẩm, kết quả, hiệu quả và cống hiến là thước đo.","C":"Phẩm chất là gốc, tài năng là điều kiện, sản phẩm và mức độ hoàn thành chức trách là căn cứ đánh giá.","D":"Đức và tài được xem xét toàn diện, trong đó hiệu quả công tác và tín nhiệm là cơ sở xác định mức độ đáp ứng vị trí."},"ans":"B","s":"Mối quan hệ giữa đức, thực tài và thước đo cán bộ được xác định như thế nào?","ref":""},{"doc":"NQ 30","n":5,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, xây dựng đội ngũ cán bộ là trách nhiệm của ai và phải được tiến hành theo phương thức nào?","opts":{"A":"Trách nhiệm của cấp ủy, tổ chức đảng và cơ quan tham mưu; tiến hành đồng bộ theo quy hoạch, kế hoạch và yêu cầu từng cấp.","B":"Trách nhiệm của hệ thống chính trị và đội ngũ cán bộ lãnh đạo; thực hiện theo phân cấp, có kiểm tra, giám sát và sơ kết định kỳ.","C":"Trách nhiệm của cả hệ thống chính trị, dưới sự lãnh đạo thống nhất của Đảng, có Nhân dân tham gia, giám sát; chủ động, khoa học, dài hạn.","D":"Trách nhiệm của cấp ủy các cấp dưới sự lãnh đạo của Đảng; triển khai có trọng tâm, gắn với yêu cầu trước mắt và chiến lược cán bộ từng ngành."},"ans":"C","s":"Xây dựng đội ngũ cán bộ là trách nhiệm của ai và phải được tiến hành theo phương thức nào?","ref":""},{"doc":"NQ 30","n":6,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, phương thức công tác cán bộ phải chuyển đổi theo hướng nào?","opts":{"A":"Từ quản lý theo từng khâu sang quản trị theo chu trình thống nhất trong từng nhiệm kỳ, tăng liên kết dữ liệu và trách nhiệm giữa các cấp.","B":"Từ quản lý theo hồ sơ sang quản trị dựa trên vị trí việc làm, dữ liệu số và phân cấp rõ trách nhiệm.","C":"Từ điều hành theo từng cơ quan sang phối hợp liên ngành, liên cấp, gắn đánh giá cán bộ với chiến lược phát triển đội ngũ.","D":"Từ quản lý riêng lẻ từng khâu, từng nhiệm kỳ sang quản trị thống nhất, đồng bộ, liên thông, xuyên suốt."},"ans":"D","s":"Phương thức công tác cán bộ phải chuyển đổi theo hướng nào?","ref":""},{"doc":"NQ 30","n":7,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, việc lựa chọn, bố trí, sử dụng cán bộ phải gắn với những yêu cầu nào?","opts":{"A":"Bố trí theo tiêu chuẩn, sở trường và quy hoạch; bảo đảm tính ổn định, kế thừa của tập thể lãnh đạo.","B":"Lựa chọn người có năng lực nổi trội, giao việc theo vị trí và tăng cường luân chuyển để phát huy khả năng.","C":"Xây dựng tập thể lãnh đạo mạnh; đúng người, đúng việc, đúng thời điểm; thực hiện có vào, có ra, có lên, có xuống.","D":"Bố trí đúng chức danh, đúng cơ cấu, đúng thẩm quyền; gắn sử dụng với đào tạo, bồi dưỡng và chuẩn bị nguồn kế cận."},"ans":"C","s":"Việc lựa chọn, bố trí, sử dụng cán bộ phải gắn với những yêu cầu nào?","ref":""},{"doc":"NQ 30","n":8,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, quyền hạn của chủ thể quyết định công tác cán bộ phải gắn với những trách nhiệm nào?","opts":{"A":"Quyền hạn đi đôi với trách nhiệm giải trình và trách nhiệm đối với hệ quả của quyết định.","B":"Quyền hạn gắn với trách nhiệm thực hiện đúng quy trình và bảo đảm chất lượng quyết định theo thẩm quyền.","C":"Quyền hạn đi đôi với trách nhiệm cá nhân trước tập thể và trách nhiệm kiểm tra việc tổ chức thực hiện quyết định.","D":"Quyền hạn gắn với trách nhiệm giải trình về căn cứ, quy trình và tính phù hợp của phương án nhân sự tại thời điểm quyết định."},"ans":"A","s":"Quyền hạn của chủ thể quyết định công tác cán bộ phải gắn với những trách nhiệm nào?","ref":""},{"doc":"NQ 30","n":9,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, mục tiêu tổng quát đặt trọng tâm xây dựng những nhóm cán bộ nào?","opts":{"A":"Cán bộ cấp chiến lược, cán bộ trẻ và cán bộ có năng lực khoa học, công nghệ trong tổng thể đội ngũ các cấp.","B":"Người đứng đầu, cán bộ lãnh đạo chủ chốt và cán bộ ở lĩnh vực trọng điểm, bảo đảm cơ cấu liên thông giữa các cấp.","C":"Cán bộ cấp chiến lược, cán bộ lãnh đạo địa phương và chuyên gia có trình độ cao, gắn với yêu cầu phát triển các ngành mũi nhọn.","D":"Cán bộ cấp chiến lược, cấp cơ sở và người đứng đầu, trong tổng thể đội ngũ các cấp đồng bộ, chất lượng cao, cơ cấu hợp lý."},"ans":"D","s":"Mục tiêu tổng quát đặt trọng tâm xây dựng những nhóm cán bộ nào?","ref":""},{"doc":"NQ 30","n":10,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, mục tiêu đến năm 2030 xác định hai hướng phát triển tương xứng nào trong đội ngũ cán bộ?","opts":{"A":"Cán bộ lãnh đạo, quản lý và cán bộ thực thi chuyên môn ở cơ sở.","B":"Cán bộ lãnh đạo, quản lý và chuyên gia, cán bộ có chuyên môn sâu.","C":"Cán bộ trong khu vực công và nhân lực chất lượng cao được thu hút từ ngoài khu vực công.","D":"Cán bộ theo hướng quản lý tổng hợp và cán bộ theo hướng nghiệp vụ, kỹ thuật chuyên ngành."},"ans":"B","s":"Mục tiêu đến năm 2030 xác định hai hướng phát triển tương xứng nào trong đội ngũ cán bộ?","ref":""},{"doc":"NQ 30","n":11,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, đột phá về đánh giá, lựa chọn, sử dụng và sàng lọc cán bộ đòi hỏi chuyển đổi cách đánh giá như thế nào?","opts":{"A":"Từ nặng hồ sơ, quy trình, thủ tục sang đánh giá bằng phẩm chất, năng lực, sản phẩm, kết quả, hiệu quả và uy tín.","B":"Từ đánh giá theo hồ sơ và nhận xét định tính sang kết hợp tiêu chuẩn chức danh, kết quả nhiệm vụ và mức độ tín nhiệm.","C":"Từ đánh giá theo kỳ sang theo dõi liên tục quá trình công tác, gắn dữ liệu, sản phẩm và phản hồi của tập thể.","D":"Từ coi trọng quy trình sang coi trọng năng lực thực tiễn, kết quả công tác và khả năng đáp ứng vị trí việc làm."},"ans":"A","s":"Đột phá về đánh giá, lựa chọn, sử dụng và sàng lọc cán bộ đòi hỏi chuyển đổi cách đánh giá như thế nào?","ref":""},{"doc":"NQ 30","n":12,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, đột phá về tạo nguồn, phát triển đội ngũ và trọng dụng nhân tài được thực hiện theo hướng nào?","opts":{"A":"Từ nguồn theo từng chức danh sang xây dựng nguồn theo nhóm vị trí, chú trọng cán bộ trẻ và cán bộ có chuyên môn sâu.","B":"Từ nguồn khép kín theo từng chức danh sang tạo nguồn mở, phát triển kế cận nhiều thế hệ, nhiều phương án, trọng dụng thực tài và cống hiến.","C":"Từ quy hoạch ổn định sang rà soát thường xuyên, bổ sung nguồn từ thực tiễn và tăng luân chuyển để kiểm chứng năng lực.","D":"Từ tạo nguồn nội bộ sang kết hợp nguồn trong và ngoài hệ thống, ưu tiên nhân lực có thành tích và triển vọng phát triển."},"ans":"B","s":"Đột phá về tạo nguồn, phát triển đội ngũ và trọng dụng nhân tài được thực hiện theo hướng nào?","ref":""},{"doc":"NQ 30","n":13,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, đột phá về thể chế và phương thức quản trị đội ngũ cán bộ dựa trên những căn cứ nào?","opts":{"A":"Tiêu chuẩn chức danh, kết quả đánh giá, quy hoạch cán bộ, dữ liệu nhân sự và cơ chế phân cấp quản lý.","B":"Vị trí việc làm, yêu cầu năng lực, dữ liệu có kiểm chứng, trách nhiệm giải trình và kiểm soát quyền lực.","C":"Vị trí việc làm, sản phẩm công tác, mức độ tín nhiệm, lịch sử công tác và yêu cầu cơ cấu của từng cấp.","D":"Năng lực thực tiễn, kết quả nhiệm vụ, cơ sở dữ liệu cán bộ, phân quyền quản lý và cơ chế kiểm tra, giám sát."},"ans":"B","s":"Đột phá về thể chế và phương thức quản trị đội ngũ cán bộ dựa trên những căn cứ nào?","ref":""},{"doc":"NQ 30","n":14,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, giáo dục, rèn luyện cán bộ phải chuyển mạnh từ học tập, nhận thức sang những hoạt động nào?","opts":{"A":"Từ học tập, nhận thức sang thực hành chuẩn mực đạo đức, chấp hành kỷ luật và hoàn thành trách nhiệm nêu gương.","B":"Từ học tập, nhận thức sang tự giác tu dưỡng, rèn luyện, tự soi, tự sửa và hành động.","C":"Từ tiếp thu kiến thức sang rèn luyện qua thực tiễn, kiểm điểm định kỳ và điều chỉnh phương pháp công tác.","D":"Từ giáo dục tập trung sang tự học, tự bồi dưỡng, cập nhật kiến thức và nâng cao năng lực thực hiện nhiệm vụ."},"ans":"B","s":"Giáo dục, rèn luyện cán bộ phải chuyển mạnh từ học tập, nhận thức sang những hoạt động nào?","ref":""},{"doc":"NQ 30","n":15,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, mỗi vị trí việc làm phải được xác định rõ những nội dung nào?","opts":{"A":"Nhiệm vụ, thẩm quyền, trách nhiệm, sản phẩm chủ yếu và yêu cầu năng lực; không vì cá nhân mà đặt ra tổ chức, vị trí.","B":"Chức năng, nhiệm vụ, quan hệ phối hợp, tiêu chuẩn chức danh và chỉ tiêu đánh giá kết quả hằng năm.","C":"Mục tiêu công việc, phạm vi quyền hạn, cơ chế phối hợp, sản phẩm đầu ra và tiêu chuẩn chuyên môn.","D":"Nhiệm vụ trọng tâm, trách nhiệm cá nhân, điều kiện bảo đảm, tiêu chí đánh giá và lộ trình phát triển của người đảm nhiệm."},"ans":"A","s":"Mỗi vị trí việc làm phải được xác định rõ những nội dung nào?","ref":""},{"doc":"NQ 30","n":16,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, mối quan hệ giữa cơ cấu và tiêu chuẩn cán bộ phải được xử lý như thế nào?","opts":{"A":"Bảo đảm cơ cấu trên cơ sở tiêu chuẩn tối thiểu, điều chỉnh yêu cầu phù hợp thực tiễn nguồn cán bộ từng địa bàn.","B":"Xác định tiêu chuẩn theo từng nhóm chức danh, đồng thời vận dụng linh hoạt để đáp ứng yêu cầu cơ cấu và tính kế thừa.","C":"Không vì cơ cấu mà hạ thấp tiêu chuẩn; không đặt ra tiêu chuẩn hình thức làm thu hẹp nguồn cán bộ.","D":"Giữ vững tiêu chuẩn cốt lõi, bổ sung tiêu chí đặc thù theo vị trí và ưu tiên nguồn đáp ứng yêu cầu cơ cấu chiến lược."},"ans":"C","s":"Mối quan hệ giữa cơ cấu và tiêu chuẩn cán bộ phải được xử lý như thế nào?","ref":""},{"doc":"NQ 30","n":17,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, tiêu chuẩn và các căn cứ đánh giá mức độ phù hợp của cán bộ được phân định như thế nào?","opts":{"A":"Tiêu chuẩn là cơ sở chủ yếu; năng lực thực tiễn và kết quả nhiệm vụ là căn cứ bổ sung để lựa chọn giữa các ứng viên tương đương.","B":"Tiêu chuẩn và uy tín là điều kiện nền tảng; kết quả công tác, kinh nghiệm và khả năng phát triển quyết định mức độ phù hợp.","C":"Tiêu chuẩn là điều kiện cần; năng lực thực tiễn, kết quả nhiệm vụ, khả năng đáp ứng vị trí và uy tín là căn cứ quan trọng.","D":"Tiêu chuẩn chức danh, quá trình công tác, mức độ tín nhiệm và tiềm năng phát triển được xem xét đồng thời khi đánh giá."},"ans":"C","s":"Tiêu chuẩn và các căn cứ đánh giá mức độ phù hợp của cán bộ được phân định như thế nào?","ref":""},{"doc":"NQ 30","n":18,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, sau khi phân cấp công tác cán bộ, cấp trên phải tập trung thực hiện những nhiệm vụ nào?","opts":{"A":"Tập trung hướng dẫn, kiểm tra trước quyết định và thẩm định các trường hợp quan trọng, phức tạp theo phân cấp.","B":"Tập trung xây dựng tiêu chuẩn, quy trình thống nhất, giám sát quá trình thực hiện và giải quyết vướng mắc vượt thẩm quyền.","C":"Tập trung thanh tra, kiểm tra định kỳ, đánh giá chất lượng quyết định và điều chỉnh phân cấp khi phát sinh bất cập.","D":"Không làm thay việc đã phân cấp; tập trung kiểm tra, giám sát, hậu kiểm và cảnh báo rủi ro."},"ans":"D","s":"Sau khi phân cấp công tác cán bộ, cấp trên phải tập trung thực hiện những nhiệm vụ nào?","ref":""},{"doc":"NQ 30","n":19,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, trách nhiệm tập thể và trách nhiệm cá nhân trong đánh giá cán bộ phải được phân định như thế nào?","opts":{"A":"Tập thể chịu trách nhiệm về chủ trương, cá nhân chịu trách nhiệm về phần việc được phân công, người đứng đầu chịu trách nhiệm điều phối chung.","B":"Không để trách nhiệm tập thể làm mờ trách nhiệm cá nhân hoặc ngược lại, đề cao trách nhiệm người đứng đầu.","C":"Trách nhiệm cá nhân được xác định theo thẩm quyền và ý kiến biểu quyết; trách nhiệm tập thể gắn với kết quả chung của quyết định.","D":"Đề cao trách nhiệm người đứng đầu, đồng thời phân định rõ trách nhiệm cơ quan tham mưu và từng thành viên tham gia đánh giá."},"ans":"B","s":"Trách nhiệm tập thể và trách nhiệm cá nhân trong đánh giá cán bộ phải được phân định như thế nào?","ref":""},{"doc":"NQ 30","n":20,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, đánh giá cá nhân người đứng đầu phải gắn với những kết quả nào?","opts":{"A":"Kết quả hoàn thành nhiệm vụ của cơ quan, mức độ tín nhiệm của tập thể, khả năng điều hành và trách nhiệm nêu gương của người đứng đầu.","B":"Kết quả của cơ quan, đơn vị; chất lượng đội ngũ; năng lực sử dụng, phát triển cán bộ, chuẩn bị nguồn kế cận; kiểm soát quyền lực, quản lý nguồn lực và chuyển biến bền vững của tổ chức.","C":"Chất lượng thực hiện chỉ tiêu, hiệu quả quản lý nguồn lực, kỷ luật nội bộ và kết quả xây dựng tập thể đoàn kết, thống nhất.","D":"Kết quả cơ quan, chất lượng cán bộ chủ chốt, năng lực đổi mới phương thức lãnh đạo và mức độ hoàn thành các nhiệm vụ đột phá."},"ans":"B","s":"Đánh giá cá nhân người đứng đầu phải gắn với những kết quả nào?","ref":""},{"doc":"NQ 30","n":21,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, phương thức đánh giá cán bộ phải kết hợp những yếu tố nào?","opts":{"A":"Kết hợp đánh giá thường xuyên với đánh giá theo kỳ, ý kiến tập thể với dữ liệu kết quả và mức độ tín nhiệm.","B":"Kết hợp tiêu chuẩn chức danh với kết quả thực hiện nhiệm vụ, sản phẩm cụ thể và phản hồi từ cơ quan, đơn vị.","C":"Kết hợp đánh giá của cấp trên, đồng cấp và cấp dưới với hồ sơ, dữ liệu và kết quả công tác được xác thực.","D":"Định tính với định lượng, quá trình với sản phẩm, kết quả và tác động; sử dụng dữ liệu, thông tin có kiểm chứng."},"ans":"D","s":"Phương thức đánh giá cán bộ phải kết hợp những yếu tố nào?","ref":""},{"doc":"NQ 30","n":22,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, kết quả đánh giá cán bộ phải được đặt trong tương quan nào để bảo đảm thực chất?","opts":{"A":"Mục tiêu được giao, điều kiện tổ chức thực hiện, kết quả đạt được và mức độ tín nhiệm của tập thể nơi công tác.","B":"Thẩm quyền, nguồn lực, điều kiện, hoàn cảnh và độ khó của nhiệm vụ; không tuyệt đối hóa chỉ số hoặc thành tích nhất thời.","C":"Quy mô nhiệm vụ, trách nhiệm của chức danh, nguồn lực được phân bổ và so sánh kết quả với các vị trí tương đương.","D":"Yêu cầu vị trí, chỉ tiêu nhiệm vụ, bối cảnh công tác và mức chuyển biến của cơ quan, đơn vị trong kỳ đánh giá."},"ans":"B","s":"Kết quả đánh giá cán bộ phải được đặt trong tương quan nào để bảo đảm thực chất?","ref":""},{"doc":"NQ 30","n":23,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, kết quả đánh giá phải được sử dụng như thế nào trong các quyết định về cán bộ?","opts":{"A":"Tổng hợp thành hồ sơ đánh giá xuyên suốt, sử dụng làm căn cứ tham khảo trong quy hoạch, đào tạo và bố trí cán bộ.","B":"Cập nhật thường xuyên vào cơ sở dữ liệu, đối chiếu qua nhiều kỳ để phục vụ đánh giá xu hướng phát triển của cán bộ.","C":"Sử dụng kết quả đã xác thực trong xem xét quy hoạch, bổ nhiệm, luân chuyển và khen thưởng theo từng thời điểm.","D":"Tích lũy, kiểm chứng và sử dụng thực chất, trực tiếp trong các quyết định về cán bộ."},"ans":"D","s":"Kết quả đánh giá phải được sử dụng như thế nào trong các quyết định về cán bộ?","ref":""},{"doc":"NQ 30","n":24,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, cán bộ không đáp ứng yêu cầu nhiệm vụ phải được xử lý như thế nào?","opts":{"A":"Kịp thời sắp xếp lại, cho từ chức, miễn nhiệm hoặc thay thế, không chờ hết nhiệm kỳ, thời hạn bổ nhiệm.","B":"Bố trí công việc phù hợp hơn, xác định thời hạn rèn luyện và xem xét lại mức độ đáp ứng trước khi quyết định nhân sự tiếp theo.","C":"Điều chuyển sang vị trí có yêu cầu phù hợp với năng lực, gắn với đánh giá lại sau một thời gian thực hiện nhiệm vụ.","D":"Xây dựng phương án sắp xếp theo mức độ hạn chế, kết hợp đào tạo bổ sung và kiểm chứng kết quả ở nhiệm vụ mới."},"ans":"A","s":"Cán bộ không đáp ứng yêu cầu nhiệm vụ phải được xử lý như thế nào?","ref":""},{"doc":"NQ 30","n":25,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, đối với cán bộ còn hạn chế nhưng có khả năng khắc phục, cần thực hiện biện pháp nào?","opts":{"A":"Xây dựng kế hoạch khắc phục gắn với nhiệm vụ cụ thể, giao cấp ủy trực tiếp theo dõi và nhận xét kết quả.","B":"Điều chỉnh phạm vi công việc, bổ sung đào tạo cần thiết và đánh giá sự chuyển biến qua kết quả thực hiện nhiệm vụ.","C":"Giao nhiệm vụ phù hợp để rèn luyện, tăng cường kiểm tra và xem xét kết quả trong kỳ đánh giá gần nhất.","D":"Xác định rõ yêu cầu, thời hạn và tổ chức đánh giá lại, gắn trách nhiệm khắc phục với kiểm chứng kết quả."},"ans":"D","s":"Đối với cán bộ còn hạn chế nhưng có khả năng khắc phục, cần thực hiện biện pháp nào?","ref":""},{"doc":"NQ 30","n":26,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, công tác bảo vệ chính trị nội bộ phải đáp ứng những yêu cầu trọng tâm nào?","opts":{"A":"Chủ động phòng ngừa từ sớm, từ xa, khách quan; nắm chắc lịch sử chính trị, chú trọng vấn đề chính trị hiện nay.","B":"Nắm chắc lịch sử chính trị, quan hệ xã hội và quá trình công tác; tăng thẩm định khi xem xét nhân sự ở vị trí quan trọng.","C":"Kết hợp phòng ngừa với kiểm tra, xác minh, coi trọng biểu hiện chính trị hiện nay và trách nhiệm nêu gương của cán bộ.","D":"Chủ động nắm tình hình, thẩm định tiêu chuẩn chính trị và xử lý kịp thời các vấn đề phát sinh trong nội bộ."},"ans":"A","s":"Công tác bảo vệ chính trị nội bộ phải đáp ứng những yêu cầu trọng tâm nào?","ref":""},{"doc":"NQ 30","n":27,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, việc kiểm soát quyết định cán bộ phải bao quát những nội dung nào?","opts":{"A":"Quy trình đề xuất, thẩm định, quyết định và trách nhiệm của các chủ thể tham gia công tác cán bộ.","B":"Căn cứ lựa chọn, tính đúng thẩm quyền và chất lượng thực hiện quyết định trong từng khâu cán bộ.","C":"Quá trình chuẩn bị nhân sự, cơ chế kiểm tra sau quyết định và trách nhiệm giải trình của người có thẩm quyền.","D":"Cả quy trình và hệ quả của quyết định cán bộ, xuyên suốt toàn bộ công tác cán bộ."},"ans":"D","s":"Việc kiểm soát quyết định cán bộ phải bao quát những nội dung nào?","ref":""},{"doc":"NQ 30","n":28,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, phạm vi phát hiện, thu hút nguồn cán bộ được mở rộng như thế nào?","opts":{"A":"Mở rộng từ nội bộ cơ quan sang các ngành, địa phương và các cơ sở đào tạo có nguồn cán bộ phù hợp.","B":"Mở rộng giữa khu vực công và khu vực tư, tập trung người có thành tích nổi trội và chuyên môn mà hệ thống đang thiếu.","C":"Mở rộng trong nước tới chuyên gia, nhà khoa học, cán bộ trẻ và nhân lực chất lượng cao ở các lĩnh vực chiến lược.","D":"Cả trong và ngoài khu vực công, bao gồm người Việt Nam ở nước ngoài có phẩm chất, tài năng, uy tín, triển vọng."},"ans":"D","s":"Phạm vi phát hiện, thu hút nguồn cán bộ được mở rộng như thế nào?","ref":""},{"doc":"NQ 30","n":29,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, nhân lực chất lượng cao có thể được huy động, sử dụng theo những phương thức nào?","opts":{"A":"Huy động theo hợp đồng chuyên môn, nhiệm vụ nghiên cứu và tư vấn chính sách, gắn với cơ quan chủ trì cụ thể.","B":"Sử dụng linh hoạt theo vị trí việc làm, nhiệm vụ trọng điểm và thời hạn nhất định, kết hợp giữa làm việc trực tiếp và từ xa.","C":"Đa dạng theo nhiệm vụ, chương trình, đề án, dự án; không nhất thiết gắn biên chế, chức vụ hoặc làm việc toàn thời gian.","D":"Thu hút theo chương trình, dự án và cơ chế chuyên gia, ưu tiên các lĩnh vực chiến lược cần năng lực chuyên sâu."},"ans":"C","s":"Nhân lực chất lượng cao có thể được huy động, sử dụng theo những phương thức nào?","ref":""},{"doc":"NQ 30","n":30,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, công tác quy hoạch cán bộ phải đổi mới theo định hướng nào?","opts":{"A":"Mở, động, gắn vị trí việc làm; từ quy hoạch theo nhiệm kỳ sang cập nhật thường xuyên theo nhu cầu sử dụng cán bộ.","B":"Tinh, thực chất, có nhiều phương án; từ chuẩn bị theo chức danh sang chuẩn bị theo nhóm chức danh và lĩnh vực trọng điểm.","C":"Linh hoạt, liên thông giữa các cấp; từ nguồn nội bộ sang kết hợp nguồn bên ngoài và nguồn cán bộ trẻ có triển vọng.","D":"Mở, động, tinh, thực chất; từ khép kín theo chức danh sang chuẩn bị đội ngũ cho nhiệm vụ và năng lực chiến lược tương lai."},"ans":"D","s":"Công tác quy hoạch cán bộ phải đổi mới theo định hướng nào?","ref":""},{"doc":"NQ 30","n":31,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, bằng cấp, chứng chỉ có vai trò như thế nào trong quyết định nhân sự?","opts":{"A":"Gắn đào tạo với quy hoạch, bố trí, sử dụng và đánh giá, nhưng không coi bằng cấp, chứng chỉ là căn cứ quyết định nhân sự.","B":"Bằng cấp, chứng chỉ là căn cứ nền tảng để xác định mức độ đáp ứng tiêu chuẩn, kết hợp kết quả công tác khi quyết định nhân sự.","C":"Bằng cấp, chứng chỉ xác nhận năng lực chuyên môn theo chức danh, được ưu tiên cùng kinh nghiệm thực tiễn trong lựa chọn cán bộ.","D":"Bằng cấp, chứng chỉ là tiêu chí quan trọng của hồ sơ nhân sự, được xem xét trước sản phẩm và hiệu quả công tác khi có nhiều ứng viên."},"ans":"A","s":"Bằng cấp, chứng chỉ có vai trò như thế nào trong quyết định nhân sự?","ref":""},{"doc":"NQ 30","n":32,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, trọng tâm đào tạo, bồi dưỡng cán bộ phải chuyển đổi theo hướng nào?","opts":{"A":"Từ trang bị kiến thức chung sang cập nhật kiến thức mới, kỹ năng lãnh đạo và phương pháp xử lý tình huống theo chức danh.","B":"Từ đào tạo theo chương trình chuẩn sang đào tạo theo vị trí việc làm, tăng thực hành và giải quyết vấn đề thực tiễn.","C":"Từ học tập tập trung sang kết hợp nhà trường, thực tiễn và tự học suốt đời, chú trọng khoa học, công nghệ và ngoại ngữ.","D":"Từ truyền đạt, lĩnh hội kiến thức sang hình thành bản lĩnh chính trị, phương pháp tư duy, năng lực dự báo, hoạch định chính sách, tổ chức thực hiện."},"ans":"D","s":"Trọng tâm đào tạo, bồi dưỡng cán bộ phải chuyển đổi theo hướng nào?","ref":""},{"doc":"NQ 30","n":33,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, việc điều động, luân chuyển cán bộ phải đáp ứng những yêu cầu nào?","opts":{"A":"Có mục tiêu theo chiều ngang và chiều dọc, gắn rèn luyện, kiểm chứng năng lực, không nhất thiết theo thứ bậc chức vụ.","B":"Theo chiều ngang giữa các lĩnh vực và địa bàn, gắn với chuẩn bị nguồn cho chức danh cao hơn và yêu cầu cơ cấu.","C":"Theo lộ trình chức vụ và quy hoạch, kết hợp trải nghiệm cơ sở với công tác tại cơ quan cấp trên để tích lũy kinh nghiệm.","D":"Theo nhu cầu tổ chức, tập trung cán bộ trẻ có triển vọng, gắn kết quả luân chuyển với đánh giá và bố trí sau quy hoạch."},"ans":"A","s":"Việc điều động, luân chuyển cán bộ phải đáp ứng những yêu cầu nào?","ref":""},{"doc":"NQ 30","n":34,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, bố trí cán bộ đúng người, đúng việc phải đồng thời gắn với những yêu cầu nào?","opts":{"A":"Tiêu chuẩn chức danh, kinh nghiệm thực tiễn và khả năng hoàn thành nhiệm vụ, gắn với yêu cầu ổn định của tập thể lãnh đạo.","B":"Năng lực, uy tín và kết quả công tác, đồng thời bảo đảm cơ cấu độ tuổi, giới tính và lĩnh vực chuyên môn.","C":"Sở trường, tiềm năng phát triển và yêu cầu vị trí, kết hợp bố trí cán bộ có trải nghiệm đa dạng để tăng tính bổ trợ trong tập thể.","D":"Cơ cấu hợp lý, năng lực và sở trường, đồng thời xây dựng tập thể lãnh đạo đoàn kết, thống nhất, bổ sung cho nhau."},"ans":"D","s":"Bố trí cán bộ đúng người, đúng việc phải đồng thời gắn với những yêu cầu nào?","ref":""},{"doc":"NQ 30","n":35,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, nguồn kế cận cho các vị trí lãnh đạo, quản lý trọng yếu phải được chuẩn bị như thế nào?","opts":{"A":"Có nguồn kế cận ít nhất hai lớp, gắn quy hoạch theo nhiệm kỳ và chuẩn bị cán bộ đủ tiêu chuẩn cho từng chức danh.","B":"Có nguồn kế cận theo cơ cấu độ tuổi, chuyên môn và địa bàn, thường xuyên rà soát để bảo đảm tính liên tục.","C":"Có nhiều phương án nhân sự từ nguồn tại chỗ và luân chuyển, gắn đào tạo, bồi dưỡng với yêu cầu chức danh trọng yếu.","D":"Có nguồn kế cận nhiều độ tuổi, nhiều phương án thay thế, gắn chủ động dự báo nhu cầu và năng lực chiến lược cần thiết."},"ans":"D","s":"Nguồn kế cận cho các vị trí lãnh đạo, quản lý trọng yếu phải được chuẩn bị như thế nào?","ref":""},{"doc":"NQ 30","n":36,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, nội dung nào phản ánh đúng các năng lực thực thi được nêu trực tiếp đối với cán bộ cấp cơ sở?","opts":{"A":"Thực thi công vụ, quản lý hành chính, giải quyết thủ tục, tuyên truyền vận động và ứng dụng công nghệ trong công việc.","B":"Quản trị địa bàn, tổ chức thực hiện chính sách, phối hợp lực lượng, nắm dư luận và xử lý vấn đề phát sinh ở cơ sở.","C":"Dân vận, tiếp công dân, giải quyết kiến nghị, quản lý nguồn lực địa phương và sử dụng dữ liệu phục vụ điều hành.","D":"Thực thi công vụ, quản trị địa bàn, dân vận, đối thoại với Nhân dân, xử lý tình huống từ sớm và chuyển đổi số."},"ans":"D","s":"Nội dung nào phản ánh đúng các năng lực thực thi được nêu trực tiếp đối với cán bộ cấp cơ sở?","ref":""},{"doc":"NQ 30","n":37,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, việc phát hiện, thu hút, trọng dụng và phát triển nhân tài phải xuất phát từ đâu?","opts":{"A":"Nhu cầu xây dựng đội ngũ ở các lĩnh vực thiếu nhân lực chất lượng cao; gắn thu hút với vị trí việc làm và chế độ đãi ngộ tương xứng.","B":"Chiến lược phát triển ngành, lĩnh vực và quy hoạch cán bộ dài hạn; gắn người tài với môi trường phát huy chuyên môn và cơ hội phát triển.","C":"Năng lực nổi trội, thành tích và triển vọng của từng cá nhân; gắn sử dụng với nhiệm vụ quan trọng và cơ chế khuyến khích đặc thù.","D":"Yêu cầu nhiệm vụ, những vấn đề lớn, khó, chiến lược của đất nước; gắn sử dụng người tài với nhiệm vụ xứng tầm, thẩm quyền, nguồn lực và sản phẩm, kết quả cần đạt."},"ans":"D","s":"Việc phát hiện, thu hút, trọng dụng và phát triển nhân tài phải xuất phát từ đâu?","ref":""},{"doc":"NQ 30","n":38,"q":"Theo Phụ lục Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, đến năm 2030, đối với vị trí lãnh đạo, quản lý cấp chiến lược và người đứng đầu các cấp, nguồn kế cận được chuẩn bị nhiều lớp phải có ít nhất bao nhiêu phương án?","opts":{"A":"3 phương án.","B":"1 phương án.","C":"2 phương án.","D":"4 phương án."},"ans":"C","s":"Đến năm 2030, đối với vị trí lãnh đạo, quản lý cấp chiến lược và người đứng đầu các cấp, nguồn kế cận được chuẩn bị nhiều lớp phải có ít nhất bao nhiêu phương án?","ref":""},{"doc":"NQ 30","n":39,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, chính sách đãi ngộ và chính sách hỗ trợ cán bộ được phân biệt theo căn cứ nào?","opts":{"A":"Đãi ngộ theo vị trí, chức danh và mức độ phức tạp của công việc; hỗ trợ theo thời gian công tác và địa bàn.","B":"Đãi ngộ theo năng lực, trình độ và kết quả đánh giá; hỗ trợ theo hoàn cảnh cá nhân và yêu cầu ổn định đội ngũ.","C":"Đãi ngộ theo kết quả, cống hiến; hỗ trợ do điều kiện công tác khó khăn, nguy hiểm, rủi ro.","D":"Đãi ngộ theo sản phẩm, hiệu quả và vị trí việc làm; hỗ trợ theo tính chất đặc thù, cường độ và thời gian thực hiện nhiệm vụ."},"ans":"C","s":"Chính sách đãi ngộ và chính sách hỗ trợ cán bộ được phân biệt theo căn cứ nào?","ref":""},{"doc":"NQ 30","n":40,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, khi giao nhiệm vụ mới, khó, phức tạp, chưa có tiền lệ, phải làm rõ những nội dung nào?","opts":{"A":"Mục tiêu, yêu cầu sản phẩm, nguồn lực và trách nhiệm người đứng đầu.","B":"Nhiệm vụ, tiến độ, cơ chế phối hợp và tiêu chí đánh giá kết quả.","C":"Mục tiêu, thẩm quyền, phạm vi và cơ chế kiểm soát.","D":"Phạm vi, nguồn lực, phương án tổ chức và trách nhiệm giải trình."},"ans":"C","s":"Khi giao nhiệm vụ mới, khó, phức tạp, chưa có tiền lệ, phải làm rõ những nội dung nào?","ref":""},{"doc":"NQ 30","n":41,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, trách nhiệm của cán bộ đổi mới gặp thiếu sót, rủi ro phải được xem xét như thế nào?","opts":{"A":"Xem xét mức độ thiệt hại, động cơ, quy trình ra quyết định và kết quả khắc phục để xác định trách nhiệm.","B":"Đánh giá tính cấp thiết của nhiệm vụ, mức độ tuân thủ thẩm quyền và mức độ rủi ro có thể dự báo tại thời điểm thực hiện.","C":"Phân biệt vụ lợi, cố ý làm trái với thiếu sót, rủi ro khách quan; xét trong bối cảnh, thông tin, điều kiện thực tế lúc quyết định.","D":"Phân loại sai sót theo nguyên nhân chủ quan, khách quan và mức độ ảnh hưởng, kết hợp xem xét tinh thần đổi mới, dám chịu trách nhiệm."},"ans":"C","s":"Trách nhiệm của cán bộ đổi mới gặp thiếu sót, rủi ro phải được xem xét như thế nào?","ref":""},{"doc":"NQ 30","n":42,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, cơ sở dữ liệu cán bộ phải được xây dựng và quản trị theo những yêu cầu nào?","opts":{"A":"Thống nhất, đồng bộ, liên thông theo thẩm quyền; đúng, đủ, sạch, sống; an toàn, cập nhật, rõ nguồn, rõ trách nhiệm quản lý.","B":"Tập trung, chuẩn hóa, số hóa theo một hệ thống dùng chung; cập nhật định kỳ, phân quyền khai thác và bảo đảm an toàn.","C":"Đồng bộ, liên thông giữa các cấp; dữ liệu xác thực, có lịch sử cập nhật, phân định quyền truy cập và trách nhiệm khai thác.","D":"Thống nhất tiêu chuẩn, kết nối theo chức năng quản lý; hồ sơ đầy đủ, có nguồn xác minh và được bảo mật theo cấp độ."},"ans":"A","s":"Cơ sở dữ liệu cán bộ phải được xây dựng và quản trị theo những yêu cầu nào?","ref":""},{"doc":"NQ 30","n":43,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, công nghệ, dữ liệu và trí tuệ nhân tạo có vai trò, giới hạn như thế nào trong công tác cán bộ?","opts":{"A":"Công nghệ, dữ liệu và trí tuệ nhân tạo là nền tảng hỗ trợ phân tích, có thể đề xuất phương án đánh giá để cấp có thẩm quyền lựa chọn và phê duyệt.","B":"Công nghệ và dữ liệu được sử dụng như nguồn căn cứ quan trọng, kết hợp đánh giá của tổ chức để chuẩn hóa quyết định nhân sự.","C":"Trí tuệ nhân tạo hỗ trợ tổng hợp, so sánh và xếp hạng thông tin cán bộ, kết quả phân tích là cơ sở ưu tiên trong các khâu sàng lọc, lựa chọn.","D":"Chỉ là công cụ hỗ trợ, không thay thế thẩm định của tổ chức và trách nhiệm quyết định của cấp có thẩm quyền."},"ans":"D","s":"Công nghệ, dữ liệu và trí tuệ nhân tạo có vai trò, giới hạn như thế nào trong công tác cán bộ?","ref":""},{"doc":"NQ 30","n":44,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, thông tin giám sát xã hội phải được sử dụng như thế nào trong đánh giá, sử dụng cán bộ?","opts":{"A":"Thông tin giám sát được tổng hợp, phân loại và đưa vào hồ sơ theo dõi; cấp ủy sử dụng khi xem xét đánh giá định kỳ.","B":"Thông tin có căn cứ được chuyển cơ quan chức năng xác minh, kết quả xác minh phục vụ kiểm điểm và hoàn thiện công tác quản lý.","C":"Ý kiến giám sát được đối chiếu với kết quả nhiệm vụ và mức độ tín nhiệm, làm nguồn thông tin bổ sung khi sử dụng cán bộ.","D":"Thông tin đã được kiểm chứng phải được sử dụng thực chất; cấp ủy và người đứng đầu tiếp thu, giải trình, khắc phục hạn chế."},"ans":"D","s":"Thông tin giám sát xã hội phải được sử dụng như thế nào trong đánh giá, sử dụng cán bộ?","ref":""},{"doc":"NQ 30","n":45,"q":"Theo Nghị quyết số 30-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương Đảng khóa XIV về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, mở rộng dân chủ trong xây dựng đội ngũ cán bộ phải gắn với những yêu cầu nào?","opts":{"A":"Mở rộng tham gia, giám sát và phản biện xã hội, đồng thời bảo đảm đúng thẩm quyền, quy trình và trách nhiệm giải trình trong công tác cán bộ.","B":"Phát huy quyền tham gia của Nhân dân, tăng công khai tiêu chí và kết quả đánh giá trong phạm vi phù hợp từng cấp.","C":"Mở rộng lấy ý kiến nhiều chủ thể, kết hợp minh bạch quy trình với tăng kiểm tra, giám sát quyền lực trong công tác cán bộ.","D":"Giữ vững nguyên tắc, kỷ luật, kỷ cương và bảo vệ bí mật công tác cán bộ, phát huy thực chất quyền làm chủ của Nhân dân."},"ans":"D","s":"Mở rộng dân chủ trong xây dựng đội ngũ cán bộ phải gắn với những yêu cầu nào?","ref":""},{"doc":"NQ 31","n":1,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, nội dung nào được xác định là nhiệm vụ trọng tâm?","opts":{"A":"Xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh là nhiệm vụ then chốt, thường xuyên.","B":"Mở rộng tổ chức bộ máy ở tất cả các cấp.","C":"Tăng số lượng văn bản lãnh đạo, chỉ đạo.","D":"Ưu tiên nhiệm vụ phát triển kinh tế trước mắt."},"ans":"A","s":"Nội dung nào được xác định là nhiệm vụ trọng tâm?","ref":""},{"doc":"NQ 31","n":2,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, quan điểm nào được nhấn mạnh trong xây dựng, chỉnh đốn Đảng và hệ thống chính trị?","opts":{"A":"Chú trọng hình thức tổ chức.","B":"Kiên định nguyên tắc, xây dựng Đảng và hệ thống chính trị vững mạnh toàn diện, đáp ứng yêu cầu mới.","C":"Tập trung vào một số khâu riêng lẻ.","D":"Duy trì nguyên trạng phương thức hoạt động."},"ans":"B","s":"Quan điểm nào được nhấn mạnh trong xây dựng, chỉnh đốn Đảng và hệ thống chính trị?","ref":""},{"doc":"NQ 31","n":3,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, Nghị quyết nhấn mạnh yêu cầu nào đối với Đảng và hệ thống chính trị?","opts":{"A":"Chỉ nâng cao hiệu quả quản lý hành chính.","B":"Ưu tiên hoàn thành chỉ tiêu ngắn hạn.","C":"Trong sạch, vững mạnh toàn diện.","D":"Tập trung mở rộng quy mô tổ chức."},"ans":"C","s":"Nghị quyết nhấn mạnh yêu cầu nào đối với Đảng và hệ thống chính trị?","ref":""},{"doc":"NQ 31","n":4,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, theo Nghị quyết, xây dựng, chỉnh đốn Đảng phải gắn với nhiệm vụ nào?","opts":{"A":"Chỉ cải cách thủ tục hành chính.","B":"Chỉ đổi mới công tác cán bộ.","C":"Chỉ tăng cường kiểm tra nội bộ.","D":"Xây dựng hệ thống chính trị trong sạch, vững mạnh."},"ans":"D","s":"Xây dựng, chỉnh đố n chế luân chuyển và trải nghiệm thực tiễn."},"ans":"A","s":"Nghị quyết yêu cầu xây dựng đội ngũ cán bộ, đảng viên theo hướng nào?","ref":""},{"doc":"NQ 31","n":46,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, theo Nghị quyết, các cấp ủy, tổ chức đảng cần làm gì để triển khai Nghị quyết?","opts":{"A":"Chỉ phổ biến trong hội nghị.","B":"Cụ thể hóa thành chương trình, kế hoạch và phân công trách nhiệm.","C":"Chờ hướng dẫn cho mọi nội dung.","D":"Chỉ báo cáo vào cuối nhiệm kỳ."},"ans":"B","s":"Các cấp ủy, tổ chức đảng cần làm gì để triển khai Nghị quyết?","ref":""},{"doc":"NQ 31","n":47,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, Theo Nghị quyết, Bộ Chính trị, Ban Bí thư có trách nhiệm nào trong tổ chức thực hiện?","opts":{"A":"Trực tiếp làm thay các cấp ủy.","B":"Chỉ tổ chức tuyên truyền.","C":"Chỉ đạo triển khai đồng bộ Nghị quyết trong cả hệ thống chính trị.","D":"Chỉ tổng kết khi kết thúc nhiệm kỳ."},"ans":"C","s":"Bộ Chính trị, Ban Bí thư có trách nhiệm nào trong tổ chức thực hiện?","ref":""},{"doc":"NQ 31","n":48,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, theo Nghị quyết, các tỉnh ủy, thành ủy và đảng ủy trực thuộc Trung ương cần làm gì?","opts":{"A":"Chỉ sao gửi văn bản.","B":"Chỉ tổ chức học tập nghị quyết.","C":"Chờ cơ quan Trung ương kiểm tra.","D":"Tổ chức học tập, quán triệt, cụ thể hóa và kiểm tra việc thực hiện."},"ans":"D","s":"Các tỉnh ủy, thành ủy và đảng ủy trực thuộc Trung ương cần làm gì?","ref":""},{"doc":"NQ 31","n":49,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, Nghị quyết yêu cầu các cơ quan tham mưu của Trung ương thực hiện nhiệm vụ nào?","opts":{"A":"Tham mưu, hướng dẫn, kiểm tra, đôn đốc theo chức năng.","B":"Thay thế trách nhiệm của cấp ủy địa phương.","C":"Chỉ tổng hợp số liệu.","D":"Chỉ tổ chức hội nghị phổ biến."},"ans":"A","s":"Nghị quyết yêu cầu các cơ quan tham mưu của Trung ương thực hiện nhiệm vụ nào?","ref":""},{"doc":"NQ 31","n":50,"q":"Theo Nghị quyết số 31-NQ/TW ngày 15/10/2026 của Ban Chấp hành Trung ương về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới, theo Nghị quyết, việc sơ kết, tổng kết thực hiện cần nhằm mục đích gì?","opts":{"A":"Chỉ hoàn thành thủ tục báo cáo.","B":"Đánh giá kết quả, phát hiện hạn chế và điều chỉnh giải pháp.","C":"Chỉ biểu dương tập thể.","D":"Chỉ thống kê số văn bản."},"ans":"B","s":"Việc sơ kết, tổng kết thực hiện cần nhằm mục đích gì?","ref":""},{"doc":"KL 105","n":1,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW ngày 15/10/2026 của BCHTW, nguyên nhân chủ yếu dẫn đến những hạn chế, bất cập trong công tác nhân tài thời gian qua là gì?","opts":{"A":"Nguồn lực ngân sách nhà nước đầu tư cho nghiên cứu khoa học, đổi mới sáng tạo còn rất hạn chế.","B":"Hệ thống cơ sở vật chất, trang thiết bị kỹ thuật tại các viện nghiên cứu chưa theo kịp thế giới.","C":"Nhận thức, trách nhiệm của một số cấp uỷ, tổ chức đảng và người đứng đầu cơ quan, đơn vị còn hạn chế.","D":"Sự cạnh tranh thu hút nguồn nhân lực chất lượng cao từ các doanh nghiệp ngoài khu vực nhà nước."},"ans":"C","s":"Nguyên nhân chủ yếu dẫn đến những hạn chế, bất cập trong công tác nhân tài thời gian qua là gì?","ref":""},{"doc":"KL 105","n":2,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, vị trí và vai trò chiến lược của nhân tài đối với đất nước được khẳng định như thế nào?","opts":{"A":"Nhân tài là nền tảng cốt lõi thúc đẩy hoàn thiện quan hệ sản xuất và bảo vệ vững chắc nền độc lập.","B":"Nhân tài là nguồn lực chiến lược đặc biệt của quốc gia, giữ vai trò quan trọng dẫn dắt phát triển.","C":"Nhân tài là lực lượng đi đầu trong việc xây dựng, phát triển nền kinh tế thị trường định hướng XHCN.","D":"Nhân tài là động lực then chốt quyết định tốc độ công nghiệp hóa và hiện đại hóa toàn diện đất nước."},"ans":"B","s":"Vị trí và vai trò chiến lược của nhân tài đối với đất nước được khẳng định như thế nào?","ref":""},{"doc":"KL 105","n":3,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, quan điểm chỉ đạo về thu hút và trọng dụng nhân tài phải dựa trên định hướng cao nhất nào?","opts":{"A":"Thúc đẩy tăng trưởng kinh tế nhanh và giữ vững ổn định chính trị - xã hội trong mọi điều kiện.","B":"Nâng cao năng lực cạnh tranh toàn cầu và hoàn thiện nền kinh tế tri thức theo xu thế hội nhập.","C":"Lấy lợi ích quốc gia - dân tộc làm định hướng cao nhất trong toàn bộ chiến lược phát triển.","D":"Tối ưu hoá việc phân bổ chỉ tiêu biên chế và nguồn lực công trong các cơ quan hành chính nhà nước."},"ans":"C","s":"Quan điểm chỉ đạo về thu hút và trọng dụng nhân tài phải dựa trên định hướng cao nhất nào?","ref":""},{"doc":"KL 105","n":4,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, bản chất việc đầu tư cho nhân tài được xác định là loại hình đầu tư nào?","opts":{"A":"Là hoạt động đầu tư công có thời hạn gắn chặt chẽ với từng chu kỳ kế hoạch phát triển 5 năm.","B":"Là nhiệm vụ chi thường xuyên của các ngành, địa phương nhằm nâng cao chất lượng cán bộ cơ sở.","C":"Là hoạt động huy động vốn xã hội hoá ngoài ngân sách nhằm giải quyết những ách tắc khoa học.","D":"Là đầu tư dài hạn, chiến lược; thực hiện có trọng tâm, trọng điểm, ưu tiên các dự án trọng điểm."},"ans":"D","s":"Bản chất việc đầu tư cho nhân tài được xác định là loại hình đầu tư nào?","ref":""},{"doc":"KL 105","n":5,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, định hướng đổi mới căn bản tư duy và phương thức quản trị nhân tài là sự chuyển dịch nào?","opts":{"A":"Chuyển từ kiểm tra quy trình công tác cán bộ sang khoán toàn diện kinh phí hoạt động cho cá nhân.","B":"Chuyển từ quản lý con người theo tổ chức, biên chế sang quản trị và phát triển nhân tài.","C":"Chuyển từ tuyển dụng theo vị trí việc làm sang bổ nhiệm trực tiếp vào các chức danh lãnh đạo.","D":"Chuyển từ phân bổ kinh phí nghiên cứu sang phương thức hỗ trợ tiền thưởng đột xuất cho đề tài."},"ans":"B","s":"Định hướng đổi mới căn bản tư duy và phương thức quản trị nhân tài là sự chuyển dịch nào?","ref":""},{"doc":"KL 105","n":6,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, đâu là thước đo chính trong quản trị và phát triển nhân tài?","opts":{"A":"Thâm niên công tác, bằng cấp chuyên môn cao, chức vụ quản lý và học hàm khoa học được phong tặng.","B":"Mức độ chấp hành nội quy, số lượng đề tài nghiên cứu nghiệm thu và các danh hiệu thi đua hằng năm.","C":"Sản phẩm, kết quả và giá trị cống hiến thực tế tạo ra cho các ngành, địa phương và xã hội.","D":"Khả năng thiết lập quan hệ công tác, bằng khen của cấp trên và số lượng công trình khoa học công bố."},"ans":"C","s":"Đâu là thước đo chính trong quản trị và phát triển nhân tài?","ref":""},{"doc":"KL 105","n":7,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, trong các khâu của công tác nhân tài, khâu nào được xác định là \"then chốt\"?","opts":{"A":"Phát hiện sớm nhân tài.","B":"Trọng dụng nhân tài.","C":"Đãi ngộ tài chính vượt trội.","D":"Tôn vinh và khen thưởng."},"ans":"B","s":"Trong các khâu của công tác nhân tài, khâu nào được xác định là \"then chốt\"?","ref":""},{"doc":"KL 105","n":8,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, khâu nào được xác định là vấn đề mang tính \"căn bản, lâu dài\"?","opts":{"A":"Đãi ngộ và tôn vinh nhân tài.","B":"Thu hút chuyên gia quốc tế.","C":"Tạo nguồn nhân tài.","D":"Tự chủ về tài chính và nhân sự."},"ans":"C","s":"Khâu nào được xác định là vấn đề mang tính \"căn bản, lâu dài\"?","ref":""},{"doc":"KL 105","n":9,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nguyên tắc cốt lõi khi trọng dụng nhân tài là phải gắn liền với những yếu tố nào sau đây?","opts":{"A":"Giới hạn quy mô đề tài, ràng buộc trách nhiệm pháp lý chặt chẽ và không cho phép xảy ra sai sót.","B":"Bố trí đúng sở trường, giao nhiệm vụ lớn, trao quyền tự chủ thực chất, chấp nhận rủi ro có kiểm soát.","C":"Bổ nhiệm chức danh quản lý nhà nước, tăng cường chế độ thanh tra định kỳ và khoán cứng kinh phí.","D":"Phân loại theo thang bảng lương hành chính, bảo đảm thâm niên và tuân thủ chặt chỉ tiêu biên chế."},"ans":"B","s":"Nguyên tắc cốt lõi khi trọng dụng nhân tài là phải gắn liền với những yếu tố nào sau đây?","ref":""},{"doc":"KL 105","n":10,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, vai trò của Nhà nước trong công tác nhân tài được xác định là gì?","opts":{"A":"Trực tiếp chỉ đạo quy trình tuyển chọn, bổ nhiệm chuyên gia tại toàn bộ cơ sở đào tạo, viện nghiên cứu.","B":"Điều hành tập trung mọi hoạt động nghiên cứu khoa học và trực tiếp cấp kinh phí cho từng cá nhân.","C":"Kiến tạo thể chế, ban hành cơ chế, chính sách vượt trội, có sức cạnh tranh trong khu vực và quốc tế.","D":"Quản lý khép kín thị trường lao động kỹ thuật cao và chỉ tiêu phân bổ nhân lực cho các ngành kinh tế."},"ans":"C","s":"Vai trò của Nhà nước trong công tác nhân tài được xác định là gì?","ref":""},{"doc":"KL 105","n":11,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nội dung nào được xác định là \"nền tảng chiến lược, lâu dài\" trong hệ sinh thái nhân tài?","opts":{"A":"Tuyển mộ các nhà khoa học hàng đầu ở nước ngoài về phụ trách các viện nghiên cứu mũi nhọn quốc gia.","B":"Phát hiện, đào tạo, bồi dưỡng và phát triển nhân tài trong nước.","C":"Chuyển dịch nhanh chóng đội ngũ chuyên gia giỏi từ khu vực kinh tế tư nhân sang khu vực cơ quan nhà nước.","D":"Ban hành các gói hỗ trợ tài chính đột phá để nhập khẩu đội ngũ chuyên gia nghiên cứu quốc tế."},"ans":"B","s":"Nội dung nào được xác định là \"nền tảng chiến lược, lâu dài\" trong hệ sinh thái nhân tài?","ref":""},{"doc":"KL 105","n":12,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, một trong những mục tiêu tổng quát của công tác nhân tài là xây dựng hệ thống quản trị như thế nào?","opts":{"A":"Hệ thống quản trị tập trung, chuyên sâu, theo dõi chặt chẽ tiến độ công tác cán bộ trong hệ thống chính trị.","B":"Hệ thống quản trị truyền thống, gắn kết trách nhiệm chặt chẽ với việc tuyển dụng công chức, viên chức.","C":"Hệ thống quản trị nhân tài quốc gia hiện đại, thống nhất, hiệu quả, có sức cạnh tranh quốc tế.","D":"Hệ thống quản trị khép kín, phân bổ theo địa bàn lãnh thổ nhằm đảm bảo đồng đều năng lực địa phương."},"ans":"C","s":"Một trong những mục tiêu tổng quát của công tác nhân tài là xây dựng hệ thống quản trị như thế nào?","ref":""},{"doc":"KL 105","n":13,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, mục tiêu đến năm 2030 phấn đấu thu hút, trọng dụng bao nhiêu nhân tài quốc gia gắn với nhiệm vụ cụ thể?","opts":{"A":"Khoảng 500 nhân tài quốc gia.","B":"Khoảng 1.000 nhân tài quốc gia.","C":"Khoảng 2.000 nhân tài quốc gia.","D":"Khoảng 5.000 nhân tài quốc gia."},"ans":"B","s":"Mục tiêu đến năm 2030 phấn đấu thu hút, trọng dụng bao nhiêu nhân tài quốc gia gắn với nhiệm vụ cụ thể?","ref":""},{"doc":"KL 105","n":14,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, mục tiêu đến năm 2030 về Chỉ số năng lực cạnh tranh nhân tài toàn cầu của Việt Nam là gì?","opts":{"A":"Thuộc nhóm 5 nước đứng đầu Đông Nam Á.","B":"Thuộc nhóm 10 quốc gia dẫn đầu châu Á.","C":"Thuộc nhóm 3 nước đứng đầu Đông Nam Á.","D":"Vươn lên vị trí dẫn đầu tuyệt đối khối ASEAN."},"ans":"C","s":"Mục tiêu đến năm 2030 về Chỉ số năng lực cạnh tranh nhân tài toàn cầu của Việt Nam là gì?","ref":""},{"doc":"KL 105","n":15,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, mục tiêu đến năm 2030 về hạ tầng số quốc gia về nhân tài gồm nội dung trọng tâm nào?","opts":{"A":"Phủ sóng hệ thống mạng nội bộ quản lý nhân sự tại toàn bộ các trường đại học, viện nghiên cứu.","B":"Vận hành đồng bộ Cơ sở dữ liệu quốc gia về nhân tài; hình thành mạng lưới chuyên gia trong nước và quốc tế.","C":"Số hóa danh bạ cán bộ, công chức, viên chức có trình độ tiến sĩ trên toàn bộ lãnh thổ quốc gia.","D":"Xây dựng nền tảng đánh giá học thuật trực tuyến phục vụ việc cấp phát các chứng chỉ chuyên gia."},"ans":"B","s":"Mục tiêu đến năm 2030 về hạ tầng số quốc gia về nhân tài gồm nội dung trọng tâm nào?","ref":""},{"doc":"KL 105","n":16,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, mục tiêu đến năm 2045 phấn đấu thứ hạng về Chỉ số năng lực cạnh tranh nhân tài toàn cầu ra sao?","opts":{"A":"Thuộc nhóm 50 quốc gia dẫn đầu thế giới.","B":"Thuộc nhóm 30 quốc gia dẫn đầu thế giới.","C":"Thuộc nhóm 20 quốc gia dẫn đầu.","D":"Thuộc nhóm 10 quốc gia dẫn đầu thế giới."},"ans":"C","s":"Mục tiêu đến năm 2045 phấn đấu thứ hạng về Chỉ số năng lực cạnh tranh nhân tài toàn cầu ra sao?","ref":""},{"doc":"KL 105","n":17,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nhân tài được nhận thức và định nghĩa cốt lõi là người như thế nào?","opts":{"A":"Người có học hàm giáo sư, học vị tiến sĩ khoa học và có thời gian công tác liên tục lâu năm trong ngành.","B":"Người giữ các chức danh lãnh đạo chủ chốt trong các cơ quan nghiên cứu hoặc cơ quan quản lý nhà nước.","C":"Người có phẩm chất, tố chất, năng lực nổi trội và tư duy sáng tạo; có sản phẩm, thành tích hoặc đóng góp đặc biệt.","D":"Người tốt nghiệp loại xuất sắc tại các trường đại học danh tiếng thế giới về nước tham gia bộ máy nhà nước."},"ans":"C","s":"Nhân tài được nhận thức và định nghĩa cốt lõi là người như thế nào?","ref":""},{"doc":"KL 105","n":18,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, việc nhận diện và đánh giá nhân tài KHÔNG được đồng nhất với những yếu tố nào sau đây?","opts":{"A":"Sản phẩm công tác cụ thể và chất lượng công việc hoàn thành trong thực tiễn nghiên cứu, ứng dụng.","B":"Người có bằng cấp cao, học hàm, học vị, chức vụ quản lý hoặc thâm niên công tác.","C":"Năng lực thực tế, uy tín nghề nghiệp đã được cộng đồng chuyên môn trong và ngoài nước thừa nhận.","D":"Giá trị cống hiến thực chất và khả năng giải quyết các nhiệm vụ khó, phức tạp của ngành, lĩnh vực."},"ans":"B","s":"Việc nhận diện và đánh giá nhân tài KHÔNG được đồng nhất với những yếu tố nào sau đây?","ref":""},{"doc":"KL 105","n":19,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nguyên tắc nào cần quán triệt nhằm khắc phục tình trạng phân tán, cục bộ trong điều phối công tác nhân tài?","opts":{"A":"Phân công đa cơ quan cùng thẩm định và phê duyệt các chương trình, dự án khoa học trọng điểm.","B":"Tăng cường phân quyền tự quyết tuyệt đối cho các tổ chức cơ sở đảng trực tiếp sử dụng nhân sự.","C":"Bảo đảm nguyên tắc một việc chỉ giao một cơ quan chủ trì, chịu trách nhiệm đến cùng.","D":"Thành lập các ban chỉ đạo lâm thời tại mỗi địa phương để giải quyết chế độ đãi ngộ vượt khung."},"ans":"C","s":"Nguyên tắc nào cần quán triệt nhằm khắc phục tình trạng phân tán, cục bộ trong điều phối công tác nhân tài?","ref":""},{"doc":"KL 105","n":20,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, trách nhiệm của người đứng đầu cơ quan, đơn vị đối với công tác nhân tài được quy định như thế nào?","opts":{"A":"Chỉ chịu trách nhiệm gián tiếp thông qua tập thể ban thường vụ hoặc hội đồng khoa học đơn vị.","B":"Trực tiếp chỉ đạo và chịu trách nhiệm về kết quả phát hiện, trọng dụng nhân tài thuộc phạm vi quản lý.","C":"Chịu trách nhiệm trong việc quản lý biên chế hành chính và các quy trình xét duyệt thi tuyển công chức.","D":"Phối hợp với tổ chức công đoàn bảo đảm thực hiện đúng các mức lương cơ sở và chế độ phụ cấp hiện hành."},"ans":"B","s":"Trách nhiệm của người đứng đầu cơ quan, đơn vị đối với công tác nhân tài được quy định như thế nào?","ref":""},{"doc":"KL 105","n":21,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, vai trò của Mặt trận Tổ quốc và các đoàn thể chính trị - xã hội trong công tác nhân tài là gì?","opts":{"A":"Trực tiếp đứng ra thi tuyển, công nhận danh hiệu và ký hợp đồng lao động đặc biệt đối với chuyên gia.","B":"Tham mưu phân bổ nguồn vốn hỗ trợ kinh phí nghiên cứu cho các doanh nghiệp khoa học công nghệ.","C":"Phát hiện, giới thiệu, tiến cử nhân tài; tuyên truyền, giám sát và phản biện xã hội về công tác nhân tài.","D":"Quản lý hồ sơ công chức, viên chức tài năng và quyết định quy hoạch nhân sự lãnh đạo địa phương."},"ans":"C","s":"Vai trò của Mặt trận Tổ quốc và các đoàn thể chính trị - xã hội trong công tác nhân tài là gì?","ref":""},{"doc":"KL 105","n":22,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, vai trò của doanh nghiệp được khẳng định ra sao trong công tác nhân tài?","opts":{"A":"Là đơn vị tài trợ thụ động nguồn kinh phí nghiên cứu để cơ quan nhà nước thực hiện các dự án.","B":"Là một chủ thể quan trọng trong phát hiện, tiến cử, thu hút, trọng dụng nhân tài.","C":"Là nơi tiếp nhận nhân sự chuyển giao sau khi các cơ quan công quyền hết nhu cầu sử dụng biên chế.","D":"Là cơ quan thẩm định độc lập đối với các chính sách tiền lương và thưởng do các bộ ban hành."},"ans":"B","s":"Vai trò của doanh nghiệp được khẳng định ra sao trong công tác nhân tài?","ref":""},{"doc":"KL 105","n":23,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nhiệm vụ tháo gỡ rào cản trong hoàn thiện cơ chế, chính sách nhân tài tập trung vào điểm nghẽn nào?","opts":{"A":"Rào cản về cơ sở vật chất kỹ thuật và thiếu hụt trụ sở làm việc tại các trung tâm nghiên cứu vùng.","B":"Tiêu chuẩn, điều kiện, quy trình, độ tuổi, thâm niên, quy hoạch, bổ nhiệm và cơ chế quản lý không còn phù hợp.","C":"Các định mức chi tiêu tài chính công và quy chế phân chia lợi nhuận từ kết quả nghiên cứu khoa học.","D":"Cơ chế phân bổ hạn ngạch đào tạo thạc sĩ, tiến sĩ cho các trường đại học ngoài công lập trên cả nước."},"ans":"B","s":"Nhiệm vụ tháo gỡ rào cản trong hoàn thiện cơ chế, chính sách nhân tài tập trung vào điểm nghẽn nào?","ref":""},{"doc":"KL 105","n":24,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nguyên tắc phân bổ nguồn lực đối với danh mục các ngành, lĩnh vực mũi nhọn ưu tiên nhân tài là gì?","opts":{"A":"Phân bổ đồng đều theo tỉ lệ diện tích tự nhiên và dân số của từng đơn vị hành chính cấp tỉnh.","B":"Ưu tiên cấp phát kinh phí đồng loạt cho toàn bộ các viện nghiên cứu chuyên ngành trực thuộc Trung ương.","C":"Bảo đảm tập trung nguồn lực, không phân bổ bình quân, dàn trải.","D":"Khoán đứt kinh phí theo đầu người tham gia dự án mà không cần gắn với tiêu chí kết quả đầu ra."},"ans":"C","s":"Nguyên tắc phân bổ nguồn lực đối với danh mục các ngành, lĩnh vực mũi nhọn ưu tiên nhân tài là gì?","ref":""},{"doc":"KL 105","n":25,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, Khung tiêu chí quốc gia về nhân tài được định hướng xây dựng theo cấu trúc nào?","opts":{"A":"Xây dựng cứng nhắc, áp dụng bắt buộc chung một hệ số tính điểm cho toàn bộ các ngành khoa học.","B":"Xây dựng theo hướng mở, linh hoạt, gồm tiêu chí nền tảng chung và tiêu chí đặc thù theo từng nhóm đối tượng.","C":"Xây dựng căn cứ tuyệt đối vào số lượng bằng phát minh sáng chế quốc tế được cấp phép hàng năm.","D":"Xây dựng dựa trên kết quả khảo sát năng lực lãnh đạo và thâm niên quản trị doanh nghiệp nhà nước."},"ans":"B","s":"Khung tiêu chí quốc gia về nhân tài được định hướng xây dựng theo cấu trúc nào?","ref":""},{"doc":"KL 105","n":26,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, yêu cầu đặt ra khi xây dựng các chính sách ưu đãi vượt trội đối với nhân tài là gì?","opts":{"A":"Giữ bí mật các quy trình phê duyệt để tránh khiếu nại, khiếu kiện từ các cơ quan hữu quan.","B":"Áp dụng mức trần tài chính như công chức thông thường để duy trì sự bình đẳng trong nội bộ cơ quan.","C":"Bảo đảm công khai, minh bạch; không để lợi dụng, tạo đặc quyền, đặc lợi.","D":"Ưu tiên xét tuyển trước hết cho cán bộ có quan hệ công tác truyền thống trong cơ quan Đảng, Nhà nước."},"ans":"C","s":"Yêu cầu đặt ra khi xây dựng các chính sách ưu đãi vượt trội đối với nhân tài là gì?","ref":""},{"doc":"KL 105","n":27,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, định mức bố trí ngân sách nhà nước cho công tác nhân tài hằng năm được xác định là bao nhiêu?","opts":{"A":"Đạt khoảng 0,05% GDP hằng năm trong tổng chi ngân sách quốc phòng, an ninh.","B":"Đạt khoảng 0,1% GDP hằng năm trong tổng nguồn lực dành cho KH, CN, đổi mới sáng tạo, chuyển đổi số.","C":"Đạt khoảng 0,5% GDP hằng năm trong tổng chi sự nghiệp giáo dục và đào tạo.","D":"Đạt khoảng 1,0% GDP hằng năm trích trực tiếp từ nguồn thu thuế thu nhập doanh nghiệp."},"ans":"B","s":"Định mức bố trí ngân sách nhà nước cho công tác nhân tài hằng năm được xác định là bao nhiêu?","ref":""},{"doc":"KL 105","n":28,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, các tỉnh, thành phố tự chủ ngân sách có thẩm quyền gì về mức chi cho công tác nhân tài?","opts":{"A":"Phải tuyệt đối tuân thủ theo mức trần chi tiêu của trung ương, không được phép điều chỉnh bổ sung.","B":"Được quyết định mức chi cao hơn, phù hợp với nhu cầu và khả năng cân đối ngân sách của địa phương.","C":"Chỉ được phép chi hỗ trợ các khoản thuê nhà và hỗ trợ đi lại theo định mức công tác phí hành chính.","D":"Phải xin phép Ban Tuyên giáo Trung ương và Bộ Tài chính trước khi phê duyệt bất kỳ gói đãi ngộ nào."},"ans":"B","s":"Các tỉnh, thành phố tự chủ ngân sách có thẩm quyền gì về mức chi cho công tác nhân tài?","ref":""},{"doc":"KL 105","n":29,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, đổi mới cơ chế quản lý và sử dụng nguồn lực tài chính cho nhân tài chuyển dịch theo hướng nào?","opts":{"A":"Kiểm soát chi tiết từng hóa đơn, chứng từ tạm ứng và định mức công tác phí theo niên độ kế toán.","B":"Đặt hàng, khoán chi theo sản phẩm, kết quả; chuyển từ kiểm soát chi tiết quy trình sang trao quyền.","C":"Rút toàn bộ tiền mặt chi trả một lần vào đầu dự án và miễn trừ mọi quy chế kiểm toán sau này.","D":"Áp dụng phương thức đấu thầu rộng rãi qua mạng đối với từng chức danh chuyên gia nghiên cứu."},"ans":"B","s":"Đổi mới cơ chế quản lý và sử dụng nguồn lực tài chính cho nhân tài chuyển dịch theo hướng nào?","ref":""},{"doc":"KL 105","n":30,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, chính sách nào được sử dụng để thúc đẩy hợp tác công tư trong đầu tư cho nhân tài?","opts":{"A":"Ban hành quy chế điều chuyển bắt buộc nhân sự cấp cao từ các doanh nghiệp tư nhân vào cơ quan nhà nước.","B":"Áp dụng chính sách ưu đãi về thuế, tín dụng và các công cụ tài chính cho hợp tác công tư.","C":"Miễn toàn bộ các loại kiểm toán độc lập đối với các doanh nghiệp có thuê chuyên gia nước ngoài làm việc.","D":"Trích nộp 10% doanh thu của các doanh nghiệp ngoài nhà nước vào quỹ bảo trợ tài năng của địa phương."},"ans":"B","s":"Chính sách nào được sử dụng để thúc đẩy hợp tác công tư trong đầu tư cho nhân tài?","ref":""},{"doc":"KL 105","n":31,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, phương thức huy động và sử dụng nhân tài theo yêu cầu nhiệm vụ được đa dạng hoá qua hình thức nào?","opts":{"A":"Bắt buộc chuyển đổi vĩnh viễn sang ngạch viên chức hưởng lương ngân sách nhà nước suốt đời.","B":"Ký kết hợp đồng chuyên gia, tư vấn, kiêm nhiệm, biệt phái, làm việc theo chương trình, dự án.","C":"Hạn chế tối đa các hình thức làm việc từ xa để phục vụ công tác thanh tra, giám sát kỷ luật lao động.","D":"Bắt buộc nhân tài phải cắt toàn bộ quan hệ làm việc với khu vực tư nhân trước khi nhận việc công."},"ans":"B","s":"Phương thức huy động và sử dụng nhân tài theo yêu cầu nhiệm vụ được đa dạng hoá qua hình thức nào?","ref":""},{"doc":"KL 105","n":32,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, chính sách tạo điều kiện cho nhân tài khu vực tư, người Việt Nam ở nước ngoài và chuyên gia quốc tế là gì?","opts":{"A":"Bắt buộc phải thay đổi quốc tịch và chuyển hộ khẩu thường trú về địa bàn nơi triển khai dự án.","B":"Tham gia các nhiệm vụ của đất nước mà không nhất thiết phải thay đổi nơi ở, nơi làm việc hoặc quan hệ công tác.","C":"Phải chấp nhận chế độ tiền lương cứng theo thang bảng lương hành chính sự nghiệp của Nhà nước.","D":"Chỉ được giao nhiệm vụ với tư cách tình nguyện viên, không được hưởng quyền tự chủ về ngân sách đề tài."},"ans":"B","s":"Chính sách tạo điều kiện cho nhân tài khu vực tư, người Việt Nam ở nước ngoài và chuyên gia quốc tế là gì?","ref":""},{"doc":"KL 105","n":33,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, căn cứ chủ yếu để phát hiện, tuyển chọn, giao nhiệm vụ và đánh giá nhân tài là gì?","opts":{"A":"Lấy việc xếp loại cán bộ hằng năm và số lượng phiếu tín nhiệm của quần chúng nhân dân làm căn cứ.","B":"Lấy việc đặt hàng các nhiệm vụ chiến lược, bài toán lớn, chương trình, dự án trọng điểm làm căn cứ.","C":"Lấy các chứng chỉ ngoại ngữ quốc tế và văn bằng đào tạo thạc sĩ, tiến sĩ ở nước ngoài làm căn cứ.","D":"Lấy số lượng bài báo khoa học đã đăng ký đề tài nghiên cứu cấp bộ làm căn cứ xét chọn duy nhất."},"ans":"B","s":"Căn cứ chủ yếu để phát hiện, tuyển chọn, giao nhiệm vụ và đánh giá nhân tài là gì?","ref":""},{"doc":"KL 105","n":34,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, đối với khu vực công, việc phát hiện, tuyển dụng nhân tài áp dụng quy định đặc biệt nào về chỉ tiêu?","opts":{"A":"Phải nằm tuyệt đối trong chỉ tiêu biên chế sự nghiệp được Hội đồng nhân dân giao đầu năm.","B":"Bắt buộc trừ vào chỉ tiêu tinh giản biên chế hằng năm của các bộ, ban, ngành liên quan.","C":"Không tính vào chỉ tiêu biên chế đối với khu vực công.","D":"Phải chờ có cán bộ nghỉ hưu đúng độ tuổi mới được xem xét tiếp nhận nhân sự tài năng."},"ans":"C","s":"Đối với khu vực công, việc phát hiện, tuyển dụng nhân tài áp dụng quy định đặc biệt nào về chỉ tiêu?","ref":""},{"doc":"KL 105","n":35,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, thái độ xử lý của Đảng đối với hành vi lợi dụng việc tiến cử nhân tài được quy định ra sao?","opts":{"A":"Nhắc nhở, phê bình nội bộ trong các cuộc họp kiểm điểm phân loại đảng viên cuối năm của chi bộ.","B":"Giảm bậc lương hiện hưởng và điều chuyển sang các đơn vị hành chính gián tiếp khác trong ngành.","C":"Tạm đình chỉ quyền bỏ phiếu đánh giá chất lượng cơ sở đảng trong thời hạn ít nhất một nhiệm kỳ.","D":"Khen thưởng người tiến cử đúng; xử lý nghiêm hành vi lợi dụng tiến cử để vụ lợi."},"ans":"D","s":"Thái độ xử lý của Đảng đối với hành vi lợi dụng việc tiến cử nhân tài được quy định ra sao?","ref":""},{"doc":"KL 105","n":36,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nguyên tắc nào cần quán triệt sâu sắc khi đánh giá kết quả đổi mới sáng tạo của nhân tài?","opts":{"A":"Buộc cá nhân bồi hoàn 100% kinh phí nếu đề tài khoa học không cho ra kết quả thực tiễn ngay.","B":"Phân định rõ rủi ro, thất bại khách quan với hành vi thiếu trách nhiệm, gian lận hoặc vụ lợi.","C":"Xem mọi thất bại trong phòng thí nghiệm đều là do năng lực yếu kém và phải xử lý kỷ luật.","D":"Bỏ qua hoàn toàn các sai phạm tài chính nếu mục tiêu cuối cùng của đề tài đã được bảo đảm."},"ans":"B","s":"Nguyên tắc nào cần quán triệt sâu sắc khi đánh giá kết quả đổi mới sáng tạo của nhân tài?","ref":""},{"doc":"KL 105","n":37,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, biện pháp xử lý đối với trường hợp nhân tài không đáp ứng yêu cầu công việc được nêu rõ là gì?","opts":{"A":"Chuyển sang ngạch công chức hành chính thông thường và giữ nguyên các chính sách ưu đãi tài chính.","B":"Kịp thời chấm dứt giao nhiệm vụ và cơ chế, chính sách liên quan khi nhân tài không đáp ứng yêu cầu.","C":"Tiếp tục kéo dài thời gian hợp đồng thêm một nhiệm kỳ 5 năm để tạo điều kiện khắc phục hạn chế.","D":"Yêu cầu toàn bộ cơ quan tiến cử chịu trách nhiệm nộp phạt tài chính thay cho cá nhân người nghiên cứu."},"ans":"B","s":"Biện pháp xử lý đối với trường hợp nhân tài không đáp ứng yêu cầu công việc được nêu rõ là gì?","ref":""},{"doc":"KL 105","n":38,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, công tác tạo nguồn nhân tài phải được gắn liền với nội dung giáo dục căn bản nào?","opts":{"A":"Chỉ tập trung trau dồi các kiến thức chuyên môn sâu và kỹ năng công nghệ mà bỏ qua các nội dung khác.","B":"Giáo dục chính trị, tư tưởng, đạo đức, rèn luyện bản lĩnh, ý thức trách nhiệm, khát vọng cống hiến.","C":"Tăng cường kỹ năng đàm phán thương mại và tối ưu hoá lợi nhuận từ chuyển giao công nghệ ra quốc tế.","D":"Rèn luyện kỹ năng quản lý hành chính nhà nước để bổ nhiệm làm người đứng đầu các tập đoàn lớn."},"ans":"B","s":"Công tác tạo nguồn nhân tài phải được gắn liền với nội dung giáo dục căn bản nào?","ref":""},{"doc":"KL 105","n":39,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, việc phát hiện sớm, tuyển chọn và đào tạo chuyên biệt tập trung vào đối tượng và lĩnh vực nào?","opts":{"A":"Cán bộ quản lý cấp phòng trong các cơ quan hành chính nhà nước ở các vùng kinh tế trọng điểm.","B":"Học sinh, sinh viên có năng khiếu, năng lực nổi trội, nhất là trong KH cơ bản, công nghệ, kỹ thuật.","C":"Toàn bộ sinh viên tốt nghiệp loại giỏi tại các trường cao đẳng và đại học trên toàn quốc.","D":"Trí thức cao tuổi có học hàm giáo sư nhằm mục tiêu tiếp tục phát huy kinh nghiệm chỉ đạo."},"ans":"B","s":"Việc phát hiện sớm, tuyển chọn và đào tạo chuyên biệt tập trung vào đối tượng và lĩnh vực nào?","ref":""},{"doc":"KL 105","n":40,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, cơ chế \"Nhân tài dẫn dắt nhân tài\" được thực hiện chủ yếu thông qua phương thức nào?","opts":{"A":"Phổ biến kiến thức đại trà qua các khóa học trực tuyến bắt buộc trên cổng thông tin quốc gia.","B":"Thực hiện chế độ cố vấn, hướng dẫn, truyền nghề giữa chuyên gia đầu ngành với nhân tài trẻ.","C":"Giao quyền kiểm tra hồ sơ lý lịch chuyên môn cho các nhà khoa học đã nghỉ hưu đảm nhiệm.","D":"Tổ chức các hội thi sát hạch tay nghề hằng năm để xếp hạng lại chức danh trong từng cơ quan."},"ans":"B","s":"Cơ chế \"Nhân tài dẫn dắt nhân tài\" được thực hiện chủ yếu thông qua phương thức nào?","ref":""},{"doc":"KL 105","n":41,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, xây dựng văn hoá trọng dụng nhân tài đòi hỏi phải kiên quyết khắc phục những biểu hiện tiêu cực nào?","opts":{"A":"Tình trạng tự do trao đổi học thuật, tranh biện dân chủ và phản biện chính sách giữa các cơ quan.","B":"Tình trạng cào bằng, cục bộ, khép kín, đố kỵ, cô lập, sợ người giỏi trong cơ quan, đơn vị.","C":"Nhu cầu đòi hỏi tăng cường nguồn lực tài chính, mở rộng phòng thí nghiệm của các nhà khoa học.","D":"Xu hướng hợp tác nghiên cứu đa ngành, liên kết giữa các trường đại học công và doanh nghiệp tư."},"ans":"B","s":"Xây dựng văn hoá trọng dụng nhân tài đòi hỏi phải kiên quyết khắc phục những biểu hiện tiêu cực nào?","ref":""},{"doc":"KL 105","n":42,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, nội dung bảo vệ nhân tài khi gặp rủi ro trong quá trình sáng tạo được quy định như thế nào?","opts":{"A":"Bảo lãnh vô điều kiện trước mọi sai phạm kể cả trường hợp có biểu hiện cố ý làm trái quy định.","B":"Có cơ chế miễn trừ trách nhiệm hợp lý đối với nhân tài khi gặp rủi ro, thất bại khách quan.","C":"Cho phép nhân tài tự quyết định việc có thực hiện kiểm toán nhà nước đối với đề tài hay không.","D":"Chuyển toàn bộ hồ sơ rủi ro học thuật sang cơ quan thanh tra hành chính để xử lý cảnh cáo nội bộ."},"ans":"B","s":"Nội dung bảo vệ nhân tài khi gặp rủi ro trong quá trình sáng tạo được quy định như thế nào?","ref":""},{"doc":"KL 105","n":43,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, giải pháp nào giúp đưa nhanh kết quả nghiên cứu khoa học của nhân tài vào thực tiễn?","opts":{"A":"Tạo điều kiện tham gia khởi nghiệp, thành lập doanh nghiệp KH&CN; thúc đẩy thương mại hoá kết quả.","B":"Cất giữ kết quả tại kho lưu trữ quốc gia để bảo đảm tuyệt mật, không đưa ra thị trường tiêu thụ.","C":"Chuyển giao toàn bộ quyền tài sản trí tuệ cho các cơ quan hành chính quản lý nhà nước định đoạt.","D":"Áp dụng mức giá trần bắt buộc đối với tất cả các sản phẩm khoa học ứng dụng bán cho nhân dân."},"ans":"A","s":"Giải pháp nào giúp đưa nhanh kết quả nghiên cứu khoa học của nhân tài vào thực tiễn?","ref":""},{"doc":"KL 105","n":44,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, việc tôn vinh nhân tài có đóng góp đặc biệt xuất sắc được thực hiện ở quy mô nào?","opts":{"A":"Tôn vinh nội bộ tại cơ sở làm việc nhằm đảm bảo tính khiêm tốn, tránh phô trương hình thức.","B":"Chỉ trao các giải thưởng học thuật độc lập do các hội đoàn nghề nghiệp tự đứng ra gây quỹ.","C":"Có hình thức tôn vinh ở tầm quốc gia, bảo đảm công khai, minh bạch, thực chất.","D":"Tôn vinh theo chu kỳ cố định 10 năm một lần gắn với các ngày lễ kỷ niệm lớn của các bộ, ban."},"ans":"C","s":"Việc tôn vinh nhân tài có đóng góp đặc biệt xuất sắc được thực hiện ở quy mô nào?","ref":""},{"doc":"KL 105","n":45,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, cơ chế đối thoại giữa lãnh đạo Đảng, Nhà nước với đội ngũ nhân tài nhằm mục đích gì?","opts":{"A":"Phổ biến nghị quyết và kiểm tra mức độ ghi nhớ các mốc thời gian lịch sử của giới trí thức.","B":"Kịp thời tháo gỡ vướng mắc, phát huy trí tuệ của nhân tài trong hoạch định, thực hiện chính sách.","C":"Lấy ý kiến biểu quyết về việc tăng mức học phí đại học và giá dịch vụ công tại các đô thị lớn.","D":"Rà soát chỉ tiêu biên chế và sắp xếp lại bộ máy lãnh đạo của các hội khoa học kỹ thuật vùng."},"ans":"B","s":"Cơ chế đối thoại giữa lãnh đạo Đảng, Nhà nước với đội ngũ nhân tài nhằm mục đích gì?","ref":""},{"doc":"KL 105","n":46,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, yêu cầu then chốt khi cử nhà khoa học xuất sắc, tài năng trẻ đi đào tạo tại nước ngoài là gì?","opts":{"A":"Phải làm việc vĩnh viễn tại các trung tâm quốc tế để hỗ trợ việc xây dựng mạng lưới đối ngoại.","B":"Gắn với chuyển giao tri thức khi trở về phục vụ công cuộc phát triển của đất nước.","C":"Bắt bu
