<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var QS = D.qs, DOCS = D.docs, PAGE = 40;
  var $ = function (id) { return document.getElementById(id); };
  var input = $("q"), list = $("list"), chips = $("chips"), count = $("count"), onlyAns = $("onlyAns"), clearBtn = $("clear");
  var state = { doc: "all", q: "", shown: PAGE };

  // Bỏ dấu tiếng Việt, giữ độ dài chuỗi 1:1 để tô sáng đúng vị trí
  function fold(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
  }
  function foldMap(s) {
    // trả về chuỗi đã bỏ dấu và mảng ánh xạ chỉ số -> chỉ số gốc
    var out = "", map = [];
    for (var i = 0; i < s.length; i++) {
      var f = fold(s[i]);
      for (var j = 0; j < f.length; j++) { out += f[j]; map.push(i); }
    }
    return { s: out, map: map };
  }
  QS.forEach(function (q) {
    q.hay = fold([q.doc, "cau " + q.n, q.q, q.opts.A, q.opts.B, q.opts.C, q.opts.D].join(" \u0001 "));
  });

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function hl(text, terms) {
    if (!terms.length) return esc(text);
    var fm = foldMap(text), marks = [];
    terms.forEach(function (t) {
      var i = 0;
      while ((i = fm.s.indexOf(t, i)) !== -1) {
        marks.push([fm.map[i], fm.map[i + t.length - 1] + 1]); i += t.length;
      }
    });
    if (!marks.length) return esc(text);
    marks.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [marks[0]];
    for (var k = 1; k < marks.length; k++) {
      var last = merged[merged.length - 1];
      if (marks[k][0] <= last[1]) last[1] = Math.max(last[1], marks[k][1]); else merged.push(marks[k]);
    }
    var out = "", pos = 0;
    merged.forEach(function (m) { out += esc(text.slice(pos, m[0])) + "<mark>" + esc(text.slice(m[0], m[1])) + "</mark>"; pos = m[1]; });
    return out + esc(text.slice(pos));
  }
  function terms() {
    var raw = state.q.trim();
    if (!raw) return [];
    // cụm trong ngoặc kép tìm nguyên cụm, phần còn lại tách theo khoảng trắng
    var out = [], re = /"([^"]+)"|(\S+)/g, m;
    while ((m = re.exec(raw))) { var t = fold(m[1] || m[2]).trim(); if (t) out.push(t); }
    return out;
  }
  function filtered(ts) {
    return QS.filter(function (q) {
      if (state.doc !== "all" && q.doc !== state.doc) return false;
      for (var i = 0; i < ts.length; i++) if (q.hay.indexOf(ts[i]) === -1) return false;
      return true;
    });
  }

  function renderChips() {
    var all = [{ code: "all", label: "Tất cả", count: QS.length }].concat(DOCS.map(function (d) { return { code: d.code, label: d.code, count: d.count, title: d.title }; }));
    chips.innerHTML = all.map(function (c) {
      return '<button type="button" class="chip" data-doc="' + esc(c.code) + '" aria-pressed="' + (state.doc === c.code) + '"' + (c.title ? ' title="' + esc(c.title) + '"' : "") + ">" + esc(c.label) + "<span>" + c.count + "</span></button>";
    }).join("");
  }
  function render() {
    var ts = terms(), res = filtered(ts), only = onlyAns.checked;
    var docName = state.doc === "all" ? "" : " trong " + state.doc;
    count.innerHTML = ts.length
      ? "<b>" + res.length + "</b> câu khớp" + docName
      : "<b>" + res.length + "</b> câu" + docName;
    clearBtn.hidden = !state.q;
    if (!res.length) {
      list.innerHTML = '<div class="empty">Không có câu nào chứa <b>' + esc(state.q) + "</b>" + docName + ".<br>Thử từ khóa ngắn hơn, hoặc chọn <b>Tất cả</b>.</div>";
      return;
    }
    var html = res.slice(0, state.shown).map(function (q) {
      var doc = DOCS.find(function (d) { return d.code === q.doc; });
      var opts = ["A", "B", "C", "D"].filter(function (k) { return !only || k === q.ans; }).map(function (k) {
        var ok = k === q.ans;
        return '<li class="' + (ok ? "ok" : "") + '"><span class="k">' + k + '.</span><span>' + hl(q.opts[k], ts) + (ok ? '<span class="chk">✓ Đáp án đúng</span>' : "") + "</span></li>";
      }).join("");
      return '<article class="q"><div class="qhead"><span class="tag">' + esc(q.doc) + "</span><span>Câu " + q.n + "</span>" +
        (q.ref ? "<span>· " + esc(q.ref) + "</span>" : "") + '<span title="' + esc(doc.title) + '">· ' + esc(doc.title) + "</span></div>" +
        '<p class="qtext">' + hl(q.s, ts) + '</p><ul class="opts">' + opts + "</ul></article>";
    }).join("");
    if (res.length > state.shown) html += '<button type="button" class="more" id="more">Xem thêm ' + Math.min(PAGE, res.length - state.shown) + " câu (còn " + (res.length - state.shown) + ")</button>";
    list.innerHTML = html;
  }

  var timer;
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = input.value; state.shown = PAGE; render(); }, 80);
  });
  clearBtn.addEventListener("click", function () { input.value = ""; state.q = ""; state.shown = PAGE; render(); input.focus(); });
  chips.addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    state.doc = b.dataset.doc; state.shown = PAGE; renderChips(); render();
    try { localStorage.setItem("tc-doc", state.doc); } catch (_) {}
  });
  onlyAns.addEventListener("change", function () { render(); try { localStorage.setItem("tc-only", onlyAns.checked ? "1" : ""); } catch (_) {} });
  list.addEventListener("click", function (e) { if (e.target.id === "more") { state.shown += PAGE; render(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); input.select(); }
    if (e.key === "Escape" && document.activeElement === input && input.value) { clearBtn.click(); }
  });

  try {
    var d = localStorage.getItem("tc-doc"); if (d && (d === "all" || DOCS.some(function (x) { return x.code === d; }))) state.doc = d;
    onlyAns.checked = localStorage.getItem("tc-only") === "1";
  } catch (_) {}
  $("lede").textContent = QS.length + " câu từ " + DOCS.length + " văn bản. Gõ từ khóa có dấu hoặc không dấu; đặt cụm từ trong ngoặc kép để tìm nguyên cụm. Đáp án đúng được tô xanh.";
  renderChips(); render();
})();
</script>
</body>
</html>
