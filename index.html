ộc phải có công trình đạt giải thưởng quốc tế lớn trước khi được giải quyết về nước.","D":"Phải nộp lại toàn bộ học bổng đã nhận từ các tổ chức viện trợ phát triển quốc tế vào ngân sách."},"ans":"B","s":"Yêu cầu then chốt khi cử nhà khoa học xuất sắc, tài năng trẻ đi đào tạo tại nước ngoài là gì?","ref":""},{"doc":"KL 105","n":47,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, cơ quan nào có thẩm quyền ban hành Chương trình hành động để lãnh đạo, chỉ đạo triển khai thực hiện Kết luận?","opts":{"A":"Ban Bí thư Trung ương Đảng.","B":"Bộ Chính trị.","C":"Ủy ban Thường vụ Quốc hội.","D":"Ban Tuyên giáo Trung ương."},"ans":"B","s":"Cơ quan nào có thẩm quyền ban hành Chương trình hành động để lãnh đạo, chỉ đạo triển khai thực hiện Kết luận?","ref":""},{"doc":"KL 105","n":48,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, trách nhiệm của Đảng uỷ Quốc hội trong việc thể chế hoá Kết luận gồm nội dung trọng tâm nào?","opts":{"A":"Thành lập các đoàn giám sát độc lập để kiểm tra trình độ ngoại ngữ của đội ngũ cán bộ khoa học.","B":"Ban hành Nghị quyết của Quốc hội quy định các cơ chế, chính sách đặc biệt về công tác nhân tài.","C":"Trực tiếp phê duyệt danh mục trang thiết bị mua sắm cho từng phòng thí nghiệm trọng điểm quốc gia.","D":"Cấp phép chuyển giao công nghệ mới ra nước ngoài đối với các công trình nghiên cứu đặc biệt."},"ans":"B","s":"Trách nhiệm của Đảng uỷ Quốc hội trong việc thể chế hoá Kết luận gồm nội dung trọng tâm nào?","ref":""},{"doc":"KL 105","n":49,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, cơ quan nào giữ vai trò chủ trì điều phối thống nhất công tác nhân tài ở tầm quốc gia?","opts":{"A":"Ban Tổ chức Trung ương.","B":"Đảng uỷ Chính phủ.","C":"Đảng uỷ Dân vận, Mặt trận và các đoàn thể Trung ương.","D":"Viện Hàn lâm Khoa học và Công nghệ Việt Nam."},"ans":"B","s":"Cơ quan nào giữ vai trò chủ trì điều phối thống nhất công tác nhân tài ở tầm quốc gia?","ref":""},{"doc":"KL 105","n":50,"q":"Trên cơ sở nghiên cứu Kết luận số 105-KL/TW của BCHTW, việc tập trung thực hiện một số nhiệm vụ chiến lược, cấp bách để sau đó sơ kết, nhân rộng được thực hiện trong khung thời gian nào?","opts":{"A":"Thực hiện cấp bách trong 6 tháng đầu.","B":"Thực hiện cấp bách trong năm đầu tiên.","C":"Thực hiện trong 2 năm đầu.","D":"Thực hiện trong suốt 5 năm của nhiệm kỳ Đại hội Đảng."},"ans":"C","s":"Việc tập trung thực hiện một số nhiệm vụ chiến lược, cấp bách để sau đó sơ kết, nhân rộng được thực hiện trong khung thời gian nào?","ref":""},{"doc":"QĐ 224","n":1,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, việc khuyến khích đảng viên làm giàu hợp pháp, chính đáng phải gắn với những yêu cầu nào?","opts":{"A":"Làm giàu trên cơ sở tuân thủ pháp luật, minh bạch tài sản, thu nhập và bảo đảm hoạt động đầu tư không ảnh hưởng đến nhiệm vụ đảng viên.","B":"Làm giàu hợp pháp, chính đáng, gắn với kiểm soát xung đột lợi ích, tuân thủ pháp luật, đề cao trách nhiệm nêu gương, giải trình và trách nhiệm xã hội của đảng viên.","C":"Phát huy nguồn lực kinh tế hợp pháp, gắn với nghĩa vụ thuế, đạo đức kinh doanh và trách nhiệm đối với người lao động, cộng đồng.","D":"Khuyến khích đầu tư hiệu quả, gắn quyền kinh doanh với trách nhiệm báo cáo, kê khai và kiểm soát các quan hệ lợi ích liên quan."},"ans":"B","s":"Việc khuyến khích đảng viên làm giàu hợp pháp, chính đáng phải gắn với những yêu cầu nào?","ref":""},{"doc":"QĐ 224","n":2,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên tham gia hoạt động đầu tư kinh doanh phải thực hiện trách nhiệm với những chủ thể, lĩnh vực nào?","opts":{"A":"Nhà nước, xã hội, môi trường, người lao động, người tiêu dùng; giữ gìn đạo đức kinh doanh và thực hành kinh doanh có trách nhiệm.","B":"Tổ chức đảng, cơ quan quản lý, đối tác kinh doanh và cộng đồng nơi hoạt động đầu tư được triển khai; đề cao minh bạch và uy tín.","C":"Nhà nước, doanh nghiệp, người lao động và cộng đồng xã hội; bảo đảm nghĩa vụ tài chính, đạo đức và văn hóa kinh doanh.","D":"Nhà nước, khách hàng, đối tác, người lao động và địa phương; thực hiện nghĩa vụ pháp lý và trách nhiệm phát triển bền vững."},"ans":"A","s":"Đảng viên tham gia hoạt động đầu tư kinh doanh phải thực hiện trách nhiệm với những chủ thể, lĩnh vực nào?","ref":""},{"doc":"QĐ 224","n":3,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, cấp ủy, tổ chức đảng có được đặt thêm điều kiện, thủ tục hạn chế quyền đầu tư kinh doanh hợp pháp của đảng viên không?","opts":{"A":"Không đặt thêm ngoài những điều kiện, thủ tục của Quy định này và hướng dẫn của Ban Bí thư; quyền, lợi ích hợp pháp được pháp luật bảo vệ.","B":"Cấp ủy có thể cụ thể hóa thêm điều kiện quản lý nội bộ phù hợp chức năng, nhiệm vụ, trên cơ sở bảo đảm quyền kinh doanh theo pháp luật.","C":"Tổ chức đảng được quy định quy trình báo cáo và xem xét nội bộ theo phân cấp quản lý cán bộ để phòng ngừa xung đột lợi ích.","D":"Cơ quan, đơn vị có thể bổ sung tiêu chí kiểm soát rủi ro đối với vị trí nhạy cảm, căn cứ đặc điểm từng lĩnh vực công tác."},"ans":"A","s":"Cấp ủy, tổ chức đảng có được đặt thêm điều kiện, thủ tục hạn chế quyền đầu tư kinh doanh hợp pháp của đảng viên không?","ref":""},{"doc":"QĐ 224","n":4,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, quyền, giới hạn và yêu cầu kiểm soát xung đột lợi ích của đảng viên được xác định theo những căn cứ nào?","opts":{"A":"Chức danh, vị trí công tác, chức trách, nhiệm vụ được giao; khi giữ nhiều chức danh, thực hiện nhiều nhiệm vụ hoặc thuộc nhiều nhóm đối tượng, phải tuân thủ giới hạn tương ứng với từng trường hợp.","B":"Căn cứ vào vị trí việc làm, phạm vi quyền quyết định, mức độ tiếp cận thông tin chưa công khai và quan hệ của khoản đầu tư với lĩnh vực công tác.","C":"Căn cứ vào chức vụ trong Đảng, cơ quan công tác, nhiệm vụ đang đảm nhiệm, lĩnh vực đầu tư và mức độ tham gia chi phối, quản lý tổ chức kinh tế.","D":"Căn cứ vào nhóm đối tượng đảng viên, hình thức đầu tư, phạm vi thẩm quyền, quy mô lợi ích và quan hệ của người có liên quan với hoạt động công vụ."},"ans":"A","s":"Quyền, giới hạn và yêu cầu kiểm soát xung đột lợi ích của đảng viên được xác định theo những căn cứ nào?","ref":""},{"doc":"QĐ 224","n":5,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên trong khu vực công phải tuân thủ yêu cầu nào về sử dụng nguồn lực công liên quan đến hoạt động đầu tư kinh doanh của bản thân, người có liên quan hoặc nhóm lợi ích?","opts":{"A":"Không được sử dụng trái quy định tài sản nhà nước, thông tin, dữ liệu, nhân lực, kết quả nghiên cứu và các nguồn lực công khác để phục vụ hoạt động đầu tư kinh doanh của bản thân, người có liên quan hoặc nhóm lợi ích.","B":"Việc sử dụng nguồn lực công phải được tách bạch, hạch toán và phê duyệt theo thẩm quyền khi có liên quan đến hoạt động tạo thu nhập.","C":"Tài sản, dữ liệu và kết quả nghiên cứu thuộc phạm vi quản lý được khai thác theo cơ chế chung, bảo đảm minh bạch và hoàn trả chi phí.","D":"Nguồn lực công liên quan đến chuyên môn được sử dụng theo quy chế cơ quan, kèm nghĩa vụ báo cáo và kiểm soát lợi ích phát sinh."},"ans":"A","s":"Đảng viên trong khu vực công phải tuân thủ yêu cầu nào về sử dụng nguồn lực công liên quan đến hoạt động đầu tư kinh doanh của bản thân, người có liên quan hoặc nhóm lợi ích?","ref":""},{"doc":"QĐ 224","n":6,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên trong khu vực công không được đầu tư kinh doanh vào tổ chức kinh tế, lĩnh vực nào?","opts":{"A":"Tổ chức kinh tế có quan hệ giao dịch thường xuyên với cơ quan, đơn vị nơi mình công tác.","B":"Tổ chức kinh tế, lĩnh vực mà mình trực tiếp quyết định, quản lý.","C":"Lĩnh vực mình trực tiếp tham mưu, đề xuất hoặc thường xuyên tiếp cận thông tin chưa công khai.","D":"Tổ chức kinh tế mà người thân thích có quyền quản lý, điều hành hoặc nắm tỷ lệ sở hữu đáng kể."},"ans":"B","s":"Đảng viên trong khu vực công không được đầu tư kinh doanh vào tổ chức kinh tế, lĩnh vực nào?","ref":""},{"doc":"QĐ 224","n":7,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, chấp thuận trong nội bộ Đảng có quan hệ như thế nào với điều kiện, trình tự, thủ tục theo pháp luật?","opts":{"A":"Chấp thuận nội bộ Đảng là bước thẩm định trước, được sử dụng làm căn cứ hoàn thiện thủ tục pháp lý theo quy định.","B":"Chấp thuận nội bộ và thủ tục pháp luật được thực hiện song song, kết quả của mỗi quy trình là điều kiện để xác nhận hoạt động đầu tư.","C":"Chấp thuận là yêu cầu trong nội bộ Đảng, không thay thế điều kiện, trình tự, thủ tục theo pháp luật.","D":"Chấp thuận nội bộ xác nhận điều kiện về tư cách đảng viên; thủ tục pháp luật tập trung vào điều kiện kinh doanh và tổ chức thực hiện."},"ans":"C","s":"Chấp thuận trong nội bộ Đảng có quan hệ như thế nào với điều kiện, trình tự, thủ tục theo pháp luật?","ref":""},{"doc":"QĐ 224","n":8,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, xung đột lợi ích được hiểu như thế nào?","opts":{"A":"Tình huống lợi ích kinh tế của đảng viên có khả năng ảnh hưởng đến tính khách quan trong tham mưu, quyết định hoặc thực hiện nhiệm vụ.","B":"Tình huống mà trong đó lợi ích của đảng viên hoặc người có liên quan tác động hoặc sẽ tác động không đúng đến việc thực hiện chức trách, nhiệm vụ, quyền hạn của đảng viên.","C":"Tình huống phát sinh quan hệ lợi ích giữa đảng viên, người thân thích và tổ chức kinh tế có liên quan đến lĩnh vực công tác.","D":"Tình huống quyền hạn công vụ và lợi ích từ hoạt động đầu tư kinh doanh cùng tồn tại, tạo nguy cơ ảnh hưởng đến việc thực hiện nhiệm vụ."},"ans":"B","s":"Xung đột lợi ích được hiểu như thế nào?","ref":""},{"doc":"QĐ 224","n":9,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, “người có liên quan” bao gồm những đối tượng nào?","opts":{"A":"Người thân thích của đảng viên hoặc tổ chức, cá nhân khác có quan hệ lợi ích với đảng viên theo quy định pháp luật.","B":"Vợ, chồng, cha mẹ, con và tổ chức kinh tế do các thành viên này sở hữu hoặc điều hành.","C":"Người thân trong phạm vi gia đình và cá nhân có giao dịch tài chính, góp vốn hoặc hợp tác kinh doanh thường xuyên với đảng viên.","D":"Cá nhân, tổ chức có quan hệ tài sản, hợp đồng hoặc lợi ích kinh tế trực tiếp với đảng viên trong hoạt động đầu tư kinh doanh."},"ans":"A","s":"“người có liên quan” bao gồm những đối tượng nào?","ref":""},{"doc":"QĐ 224","n":10,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích được nhận diện qua những đặc điểm nào?","opts":{"A":"Vị trí, lĩnh vực trong khu vực công mà quyền quyết định, tham mưu, đề xuất hoặc việc tiếp cận thông tin chưa công khai có thể ảnh hưởng đến quyền, nghĩa vụ, lợi ích kinh tế liên quan đến đầu tư kinh doanh và phát sinh xung đột lợi ích.","B":"Vị trí trong khu vực công có thẩm quyền phê duyệt, thanh tra, kiểm tra, phân bổ nguồn lực hoặc quyết định thủ tục liên quan trực tiếp đến hoạt động kinh doanh của tổ chức, cá nhân.","C":"Lĩnh vực công tác có quan hệ thường xuyên với doanh nghiệp, tham mưu chính sách, xử lý thủ tục hoặc quản lý thị trường, từ đó có khả năng tác động đến lợi ích kinh tế của chủ thể liên quan.","D":"Vị trí có điều kiện tiếp cận dữ liệu nội bộ, thông tin quy hoạch, kế hoạch, chính sách hoặc quyết định quản lý chưa công khai có thể tạo lợi thế kinh tế cho hoạt động đầu tư."},"ans":"A","s":"Vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích được nhận diện qua những đặc điểm nào?","ref":""},{"doc":"QĐ 224","n":11,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, việc chi phối tổ chức kinh tế được xác định dựa trên bản chất nào?","opts":{"A":"Trực tiếp nắm tỷ lệ vốn cho phép quyết định các vấn đề quan trọng, lựa chọn nhân sự quản lý hoặc phê duyệt chiến lược của tổ chức kinh tế theo điều lệ, thỏa thuận.","B":"Có quyền quyết định nhân sự quản lý, chiến lược, kế hoạch tài chính hoặc giao dịch chủ yếu thông qua sở hữu vốn, quyền biểu quyết hay thỏa thuận với các thành viên khác.","C":"Trực tiếp sở hữu vốn hoặc có thỏa thuận cho phép quyết định những vấn đề trọng yếu về tài chính, nhân sự, đầu tư và hoạt động kinh doanh của tổ chức kinh tế.","D":"Trực tiếp hoặc thông qua tổ chức, cá nhân khác nắm quyền quyết định hoặc có khả năng chi phối hoạt động của tổ chức kinh tế thông qua sở hữu vốn, quyền biểu quyết, thỏa thuận, ủy quyền hoặc hình thức khác theo quy định của pháp luật."},"ans":"D","s":"Việc chi phối tổ chức kinh tế được xác định dựa trên bản chất nào?","ref":""},{"doc":"QĐ 224","n":12,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, hoạt động chuyên môn và khai thác tài sản tạo thu nhập bao gồm những nội dung nào?","opts":{"A":"Nghiên cứu, giảng dạy, hành nghề, tư vấn chuyên môn, chuyển giao công nghệ và khai thác tài sản thuộc sở hữu hợp pháp.","B":"Sáng tạo, nghiên cứu, cung cấp dịch vụ chuyên môn, chuyển giao tài sản trí tuệ và khai thác tài sản để tạo thu nhập theo pháp luật.","C":"Nghiên cứu, giảng dạy, sáng tạo, hành nghề, chuyển giao, thương mại hóa kết quả nghiên cứu, công nghệ, tài sản trí tuệ; khai thác tài sản hợp pháp và thực hiện hoạt động tạo thu nhập hợp pháp khác.","D":"Hoạt động nghề nghiệp, khoa học, công nghệ, sáng tạo và khai thác tài sản hợp pháp gắn với chuyên môn, kinh nghiệm của đảng viên."},"ans":"C","s":"Hoạt động chuyên môn và khai thác tài sản tạo thu nhập bao gồm những nội dung nào?","ref":""},{"doc":"QĐ 224","n":13,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, hai nhóm hoạt động đầu tư kinh doanh tại khoản 2 và khoản 3 Điều 4 khác nhau như thế nào?","opts":{"A":"Khoản 2 không thành lập tổ chức kinh tế; khoản 3 được thành lập tổ chức kinh tế nhưng tỷ lệ góp vốn chưa đến mức chi phối.","B":"Khoản 2 đầu tư thụ động, không quản lý; khoản 3 được tham gia chi phối và quản lý nhưng không trực tiếp điều hành.","C":"Khoản 2: không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; khoản 3: có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành.","D":"Khoản 2 không chi phối, quản lý, điều hành; khoản 3 có thể chi phối và tham gia quản lý ở mức không giữ chức danh điều hành."},"ans":"C","s":"Hai nhóm hoạt động đầu tư kinh doanh tại khoản 2 và khoản 3 Điều 4 khác nhau như thế nào?","ref":""},{"doc":"QĐ 224","n":14,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, phạm vi chi phối, quản lý, điều hành tại Điều 4 có chỉ giới hạn ở doanh nghiệp không?","opts":{"A":"Phạm vi chi phối, quản lý, điều hành được xác định đối với tổ chức kinh tế có tư cách pháp nhân và các dự án do tổ chức đó thực hiện.","B":"Không; phạm vi còn bao gồm các tổ chức kinh tế khác, dự án đầu tư, hợp đồng đầu tư, hợp đồng hợp tác kinh doanh và các hình thức đầu tư kinh doanh khác theo pháp luật.","C":"Phạm vi bao gồm doanh nghiệp, hợp tác xã, liên hiệp hợp tác xã và dự án đầu tư gắn với hoạt động của các tổ chức kinh tế này.","D":"Phạm vi được xác định theo tổ chức kinh tế và dự án đầu tư; hợp đồng hợp tác kinh doanh được xem xét theo tư cách của các bên tham gia."},"ans":"B","s":"Phạm vi chi phối, quản lý, điều hành tại Điều 4 có chỉ giới hạn ở doanh nghiệp không?","ref":""},{"doc":"QĐ 224","n":15,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên ngoài khu vực công có quyền tham gia hoạt động đầu tư kinh doanh như thế nào?","opts":{"A":"Được thực hiện các hoạt động tại Điều 4 và hoạt động đầu tư kinh doanh khác mà pháp luật không cấm, không phải xin chấp thuận của tổ chức đảng; khi phát sinh xung đột lợi ích phải báo cáo, kiểm soát theo Điều 12.","B":"Được thực hiện các hoạt động tại Điều 4 theo quy định pháp luật; hoạt động có khả năng phát sinh xung đột lợi ích cần báo cáo tổ chức đảng trước khi thực hiện.","C":"Được đầu tư trong các ngành nghề pháp luật cho phép và tham gia quản lý, điều hành; khoản đầu tư có quan hệ với nhiệm vụ công phải được kiểm soát lợi ích.","D":"Được tự quyết hoạt động đầu tư kinh doanh hợp pháp; khi tham gia tổ chức kinh tế có chi phối hoặc quản lý cần thực hiện chế độ báo cáo theo phân cấp."},"ans":"A","s":"Đảng viên ngoài khu vực công có quyền tham gia hoạt động đầu tư kinh doanh như thế nào?","ref":""},{"doc":"QĐ 224","n":16,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên ngoài khu vực công khi được giao thực hiện nhiệm vụ công phải tuân thủ những giới hạn nào?","opts":{"A":"Tách bạch nhiệm vụ công với hoạt động kinh doanh; báo cáo đầy đủ quan hệ lợi ích; tránh tham gia quyết định, tham mưu hoặc xử lý vụ việc liên quan trực tiếp đến tổ chức kinh tế, người có liên quan và khoản đầu tư của mình.","B":"Bảo đảm công khai quan hệ đầu tư, tuân thủ thẩm quyền được giao; chủ động đề xuất cơ chế giám sát, phân công người khác xử lý khi nhiệm vụ công có liên quan đến lợi ích kinh tế của mình hoặc người có liên quan.","C":"Không lợi dụng tư cách đảng viên, chức vụ trong Đảng hoặc quan hệ với cơ quan, tổ chức, cá nhân có thẩm quyền để tạo lợi thế bất bình đẳng, tác động trái quy định, phục vụ lợi ích riêng, lợi ích nhóm; không xử lý công việc, nhiệm vụ có xung đột lợi ích chưa được kiểm soát hoặc làm ảnh hưởng tiêu cực đến việc thực hiện nhiệm vụ công được giao.","D":"Thực hiện nhiệm vụ công theo nguyên tắc khách quan, bình đẳng, minh bạch; báo cáo cấp có thẩm quyền về quan hệ lợi ích và áp dụng biện pháp kiểm soát trước khi tham gia giải quyết công việc liên quan."},"ans":"C","s":"Đảng viên ngoài khu vực công khi được giao thực hiện nhiệm vụ công phải tuân thủ những giới hạn nào?","ref":""},{"doc":"QĐ 224","n":17,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý được thực hiện những hoạt động nào mà không phải xin chấp thuận?","opts":{"A":"Hoạt động chuyên môn, khai thác tài sản tạo thu nhập và góp vốn vào tổ chức kinh tế mà không tham gia quản lý, điều hành.","B":"Đầu tư tài chính, mua cổ phần, phần vốn góp và thành lập tổ chức kinh tế khi không giữ chức vụ quản lý.","C":"Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.","D":"Hoạt động tạo thu nhập hợp pháp và đầu tư vào doanh nghiệp ở mức không chi phối, không tham gia quản lý, điều hành."},"ans":"C","s":"Đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý được thực hiện những hoạt động nào mà không phải xin chấp thuận?","ref":""},{"doc":"QĐ 224","n":18,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, những hoạt động nào không được thực hiện đối với đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý?","opts":{"A":"Không được tham gia quản lý, điều hành tổ chức kinh tế; khoản đầu tư thành lập hoặc có chi phối được tiếp tục khi đảng viên không trực tiếp điều hành, đã báo cáo đầy đủ và áp dụng biện pháp kiểm soát xung đột lợi ích.","B":"Không được giữ chức danh quản lý, điều hành hoặc trực tiếp chi phối hoạt động doanh nghiệp; việc góp vốn, mua cổ phần và thành lập tổ chức kinh tế được thực hiện trong giới hạn pháp luật và theo phân cấp quản lý.","C":"Không được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; không được tham gia quản lý, điều hành hoạt động đầu tư kinh doanh; không được duy trì khoản đầu tư kinh doanh có xung đột lợi ích chưa được kiểm soát.","D":"Không được trực tiếp quản lý, điều hành hoặc quyết định hoạt động tổ chức kinh tế; khoản đầu tư thành lập tổ chức kinh tế hoặc có chi phối được xem xét khi không phát sinh xung đột lợi ích."},"ans":"C","s":"Những hoạt động nào không được thực hiện đối với đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý?","ref":""},{"doc":"QĐ 224","n":19,"q":"Theo khoản 2 Điều 7 Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành khi đáp ứng điều kiện nào?","opts":{"A":"Đáp ứng tiêu chuẩn chức danh, hoàn thành tốt nhiệm vụ và thực hiện đầy đủ kê khai, báo cáo hoạt động đầu tư theo quy định.","B":"Hoạt động đầu tư nằm ngoài lĩnh vực công tác trực tiếp, có phương án kiểm soát xung đột lợi ích và được cấp ủy cùng cấp thống nhất.","C":"Không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích và được cấp có thẩm quyền chấp thuận trước khi thực hiện.","D":"Không trực tiếp tham mưu, quyết định đối với lĩnh vực đầu tư và được cơ quan quản lý cán bộ ghi nhận trong hồ sơ trước khi thực hiện."},"ans":"C","s":"Đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành khi đáp ứng điều kiện nào?","ref":"khoản 2 Điều 7"},{"doc":"QĐ 224","n":20,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý có được thực hiện hoạt động đầu tư kinh doanh có tham gia quản lý, điều hành không?","opts":{"A":"Được tham gia quản lý khi không giữ chức danh người đại diện theo pháp luật và hoạt động kinh doanh ngoài lĩnh vực công tác.","B":"Được tham gia quản lý ở tổ chức kinh tế không có quan hệ lợi ích với cơ quan, đơn vị và đã được cấp có thẩm quyền chấp thuận.","C":"Không được thực hiện hoạt động đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối.","D":"Được tham gia điều hành theo ủy quyền trong thời hạn nhất định nếu bảo đảm hoàn thành nhiệm vụ công và kiểm soát xung đột lợi ích."},"ans":"C","s":"Đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý có được thực hiện hoạt động đầu tư kinh doanh có tham gia quản lý, điều hành không?","ref":""},{"doc":"QĐ 224","n":21,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là cán bộ, công chức ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích phải tuân thủ giới hạn nào?","opts":{"A":"Giới hạn tập trung vào hoạt động quản lý, điều hành; khoản đầu tư thành lập tổ chức kinh tế được xem xét khi có biện pháp kiểm soát lợi ích.","B":"Không được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối; không được thực hiện hoạt động đầu tư kinh doanh có tham gia quản lý, điều hành.","C":"Hoạt động có chi phối phải xin chấp thuận; hoạt động thành lập tổ chức kinh tế không tham gia điều hành được thực hiện khi tách bạch chức trách.","D":"Hoạt động tại khoản 3 được xem xét theo thẩm quyền, còn khoản 4 bị hạn chế trong thời gian giữ vị trí có nguy cơ cao."},"ans":"B","s":"Đảng viên là cán bộ, công chức ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích phải tuân thủ giới hạn nào?","ref":""},{"doc":"QĐ 224","n":22,"q":"Theo điểm c khoản 1 Điều 8 Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là viên chức không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích được thực hiện hoạt động đầu tư kinh doanh quy định tại khoản 3 Điều 4 (có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành). Hoạt động này có phải xin chấp thuận không?","opts":{"A":"Được làm và không phải xin chấp thuận theo Quy định này.","B":"Được thực hiện sau khi báo cáo cấp ủy và hoàn tất biện pháp kiểm soát xung đột lợi ích.","C":"Được thực hiện sau khi cấp có thẩm quyền quản lý viên chức chấp thuận theo phân cấp.","D":"Được thực hiện theo cơ chế thông báo trước, cấp ủy theo dõi và giám sát trong quá trình đầu tư."},"ans":"A","s":"Đảng viên là viên chức không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích được thực hiện hoạt động đầu tư kinh doanh quy định tại khoản 3 Điều 4 (có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành). Hoạt động này có phải xin chấp thuận không?","ref":"điểm c khoản 1 Điều 8"},{"doc":"QĐ 224","n":23,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là viên chức đang làm việc muốn thực hiện hoạt động đầu tư kinh doanh có tham gia quản lý, điều hành theo điểm a khoản 2 Điều 8 phải đáp ứng những điều kiện nào?","opts":{"A":"Không giữ chức vụ quản lý, không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích; được cấp có thẩm quyền quản lý cán bộ chấp thuận theo hướng dẫn của Ban Bí thư; không làm ảnh hưởng đến chức trách, nhiệm vụ, chất lượng dịch vụ công.","B":"Không giữ chức vụ quản lý, hoạt động đầu tư ngoài lĩnh vực chuyên môn trực tiếp, được người đứng đầu đơn vị chấp thuận và có phương án bảo đảm thời gian, chất lượng thực hiện chức trách, nhiệm vụ và dịch vụ công.","C":"Không ở vị trí, lĩnh vực có nguy cơ cao; có phương án tách bạch công việc và hoạt động kinh doanh, được cấp ủy đồng ý, thực hiện đầy đủ nghĩa vụ báo cáo và bảo đảm chất lượng dịch vụ công.","D":"Không giữ chức vụ quản lý; hoạt động đầu tư thực hiện ngoài giờ làm việc, sử dụng nguồn lực riêng, có cơ chế tách bạch tài sản, nhân lực và cam kết không ảnh hưởng nhiệm vụ chuyên môn."},"ans":"A","s":"Đảng viên là viên chức đang làm việc muốn thực hiện hoạt động đầu tư kinh doanh có tham gia quản lý, điều hành theo điểm a khoản 2 Điều 8 phải đáp ứng những điều kiện nào?","ref":""},{"doc":"QĐ 224","n":24,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là viên chức không giữ chức vụ quản lý, tạm thời rời vị trí công tác để đầu tư kinh doanh, có được miễn kiểm soát xung đột lợi ích không?","opts":{"A":"Trong thời gian tạm rời vị trí, xung đột lợi ích được quản lý theo chế độ riêng do cơ quan, đơn vị thỏa thuận với viên chức.","B":"Việc tạm rời vị trí làm thay đổi phạm vi kiểm soát; các quan hệ lợi ích phát sinh được xem xét khi tiếp nhận trở lại.","C":"Không. Trong thời gian tạm thời rời vị trí công tác vẫn phải kiểm soát xung đột lợi ích; các điều kiện, quan hệ công tác do cấp có thẩm quyền quản lý cán bộ quyết định theo hướng dẫn của Ban Bí thư.","D":"Cấp có thẩm quyền quyết định thời hạn và quan hệ công tác, còn kiểm soát xung đột lợi ích được thực hiện khi viên chức quay lại cơ quan."},"ans":"C","s":"Đảng viên là viên chức không giữ chức vụ quản lý, tạm thời rời vị trí công tác để đầu tư kinh doanh, có được miễn kiểm soát xung đột lợi ích không?","ref":""},{"doc":"QĐ 224","n":25,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, ngoại lệ nào cho phép đảng viên là viên chức giữ chức vụ quản lý đồng thời tham gia quản lý tổ chức kinh tế?","opts":{"A":"Được cơ quan chủ quản chấp thuận kiêm nhiệm quản lý tổ chức kinh tế phục vụ trực tiếp nhiệm vụ chuyên môn của đơn vị.","B":"Được cử tham gia quản lý hoặc làm đại diện phần vốn, tài sản của đơn vị tại tổ chức kinh tế theo quy định pháp luật.","C":"Tổ chức kinh tế có vốn góp của đơn vị và hoạt động trong lĩnh vực liên quan đến chức năng chuyên môn của viên chức.","D":"Được giao nhiệm vụ tư vấn, kiểm soát hoặc tham gia hội đồng quản trị mà không trực tiếp điều hành hoạt động thường xuyên."},"ans":"B","s":"Ngoại lệ nào cho phép đảng viên là viên chức giữ chức vụ quản lý đồng thời tham gia quản lý tổ chức kinh tế?","ref":""},{"doc":"QĐ 224","n":26,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân được thực hiện những hoạt động nào mà không phải xin chấp thuận?","opts":{"A":"Hoạt động chuyên môn, khai thác tài sản và góp vốn vào doanh nghiệp ngoài lĩnh vực quốc phòng, an ninh.","B":"Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.","C":"Đầu tư tài chính, mua cổ phần, phần vốn góp và đầu tư thành lập tổ chức kinh tế ở mức không chi phối.","D":"Hoạt động tạo thu nhập hợp pháp và đầu tư tại tổ chức kinh tế không có quan hệ giao dịch với cơ quan, đơn vị."},"ans":"B","s":"Đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân được thực hiện những hoạt động nào mà không phải xin chấp thuận?","ref":""},{"doc":"QĐ 224","n":27,"q":"Theo khoản 2 Điều 9 Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành khi đáp ứng những điều kiện nào?","opts":{"A":"Không trực tiếp xử lý công việc liên quan đến tổ chức kinh tế; có báo cáo cấp ủy, được người chỉ huy thống nhất và xây dựng biện pháp bảo vệ bí mật nhà nước, bí mật công tác trong suốt thời gian đầu tư.","B":"Hoạt động đầu tư nằm ngoài lĩnh vực công tác, được người chỉ huy đồng ý, có phương án tách bạch thời gian và nguồn lực, đồng thời bảo đảm yêu cầu bảo mật, an ninh và hoàn thành nhiệm vụ.","C":"Không giữ chức vụ chỉ huy, quản lý; khoản đầu tư không chi phối hoạt động doanh nghiệp, có báo cáo trước và thực hiện đầy đủ yêu cầu về bí mật, quốc phòng, an ninh.","D":"Không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích; được cấp có thẩm quyền chấp thuận; bảo đảm bí mật nhà nước, bí mật công tác và không phương hại đến quốc phòng, an ninh theo quy định."},"ans":"D","s":"Đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành khi đáp ứng những điều kiện nào?","ref":"khoản 2 Điều 9"},{"doc":"QĐ 224","n":28,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích phải tuân thủ giới hạn nào?","opts":{"A":"Hạn chế hoạt động tại khoản 4; hoạt động tại khoản 3 được xem xét khi có phương án kiểm soát xung đột lợi ích, bảo đảm bí mật và được cấp có thẩm quyền chấp thuận.","B":"Hạn chế khoản đầu tư có chi phối và hoạt động quản lý, điều hành; việc thành lập tổ chức kinh tế ở mức không chi phối được xem xét theo phân cấp quản lý.","C":"Hạn chế hoạt động quản lý, điều hành và các khoản đầu tư có liên quan trực tiếp đến lĩnh vực thực hiện nhiệm vụ quốc phòng, an ninh, bí mật công tác.","D":"Không được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối và hoạt động có tham gia quản lý, điều hành quy định tại khoản 3, khoản 4 Điều 4."},"ans":"D","s":"Đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích phải tuân thủ giới hạn nào?","ref":""},{"doc":"QĐ 224","n":29,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, ngoại lệ nào cho phép đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân quản lý, điều hành tổ chức kinh tế?","opts":{"A":"Khi hoạt động quản lý gắn với phần vốn cá nhân đã được cấp có thẩm quyền chấp thuận.","B":"Khi tổ chức kinh tế hoạt động ngoài lĩnh vực quốc phòng, an ninh và không phát sinh xung đột lợi ích.","C":"Chỉ trong trường hợp được cấp có thẩm quyền phân công, giao nhiệm vụ; ngoài ngoại lệ đó không được quản lý, điều hành trong thời gian phục vụ.","D":"Khi tham gia quản lý theo thời hạn nhất định, có báo cáo cấp ủy và bảo đảm hoàn thành chức trách quân sự, công an."},"ans":"C","s":"Ngoại lệ nào cho phép đảng viên đang công tác, phục vụ trong Quân đội nhân dân, Công an nhân dân quản lý, điều hành tổ chức kinh tế?","ref":""},{"doc":"QĐ 224","n":30,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước phải thực hiện quyền đối với phần vốn cá nhân như thế nào?","opts":{"A":"Quản lý phần vốn cá nhân theo cơ chế đầu tư độc lập, báo cáo định kỳ với cơ quan đại diện chủ sở hữu về các giao dịch có liên quan.","B":"Tách bạch với chức trách quản lý, đại diện phần vốn nhà nước và bảo đảm kiểm soát xung đột lợi ích.","C":"Thực hiện quyền cổ đông, thành viên góp vốn theo pháp luật và ưu tiên bảo đảm lợi ích của doanh nghiệp nhà nước trong trường hợp có giao dịch liên quan.","D":"Phân tách hồ sơ và dòng tiền của phần vốn cá nhân, đồng thời kê khai đầy đủ với cơ quan quản lý cán bộ và cơ quan đại diện chủ sở hữu."},"ans":"B","s":"Đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước phải thực hiện quyền đối với phần vốn cá nhân như thế nào?","ref":""},{"doc":"QĐ 224","n":31,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, khi được chấp thuận thực hiện hoạt động tại khoản 2 Điều 10, đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước phải đáp ứng điều kiện nào về tổ chức kinh tế và ngành, lĩnh vực hoạt động?","opts":{"A":"Tổ chức kinh tế phải ở ngoài khu vực công; hoạt động của tổ chức kinh tế không thuộc ngành, lĩnh vực có lợi ích liên quan trực tiếp đến doanh nghiệp nhà nước mà đảng viên đó quản lý hoặc đại diện phần vốn nhà nước.","B":"Tổ chức kinh tế ngoài doanh nghiệp nhà nước; ngành nghề đầu tư không trùng với ngành nghề kinh doanh chính của doanh nghiệp mà đảng viên quản lý.","C":"Tổ chức kinh tế ngoài phạm vi doanh nghiệp được giao đại diện; hoạt động không có giao dịch thường xuyên với doanh nghiệp nhà nước liên quan.","D":"Tổ chức kinh tế thuộc khu vực tư; ngành, lĩnh vực không nằm trong phạm vi thẩm quyền quyết định trực tiếp của đảng viên tại doanh nghiệp nhà nước."},"ans":"A","s":"Khi được chấp thuận thực hiện hoạt động tại khoản 2 Điều 10, đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước phải đáp ứng điều kiện nào về tổ chức kinh tế và ngành, lĩnh vực hoạt động?","ref":""},{"doc":"QĐ 224","n":32,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên đã nghỉ hưu, không còn công tác trong khu vực công có quyền đầu tư kinh doanh như thế nào?","opts":{"A":"Thực hiện như đảng viên ngoài khu vực công sau khi hoàn thành nghĩa vụ báo cáo với tổ chức đảng nơi sinh hoạt và kê khai hoạt động đầu tư.","B":"Được tham gia đầy đủ các hình thức đầu tư kinh doanh theo pháp luật sau khi nghỉ hưu, với yêu cầu bảo mật thông tin công tác đã tiếp cận.","C":"Thực hiện như đảng viên ngoài khu vực công, trừ hoạt động bị hạn chế liên quan lĩnh vực, công việc đã phụ trách trong phạm vi, thời hạn pháp luật quy định.","D":"Thực hiện theo quy định đối với nhóm chức danh gần nhất trước khi nghỉ hưu trong một thời hạn chuyển tiếp do cấp quản lý cán bộ xác định."},"ans":"C","s":"Đảng viên đã nghỉ hưu, không còn công tác trong khu vực công có quyền đầu tư kinh doanh như thế nào?","ref":""},{"doc":"QĐ 224","n":33,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, đảng viên thôi giữ chức vụ nhưng tiếp tục công tác trong khu vực công phải thực hiện quyền, nghĩa vụ và trách nhiệm theo căn cứ nào?","opts":{"A":"Theo chức danh, vị trí mới được giao, đồng thời tuân thủ hạn chế liên quan lĩnh vực, công việc đã phụ trách.","B":"Theo chức danh, vị trí cũ trong thời hạn chuyển tiếp và từng bước chuyển sang quyền, nghĩa vụ của vị trí mới.","C":"Theo vị trí mới đối với nhiệm vụ công, còn giới hạn đầu tư tiếp tục áp dụng theo nhóm chức vụ cao nhất từng đảm nhiệm.","D":"Theo phân cấp quản lý của vị trí mới và các cam kết đã thực hiện trước khi thôi chức, gắn với kiểm soát xung đột lợi ích."},"ans":"A","s":"Đảng viên thôi giữ chức vụ nhưng tiếp tục công tác trong khu vực công phải thực hiện quyền, nghĩa vụ và trách nhiệm theo căn cứ nào?","ref":""},{"doc":"QĐ 224","n":34,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, việc nhận diện, đánh giá xung đột lợi ích phải dựa trên mối liên hệ nào?","opts":{"A":"Mối liên hệ cụ thể giữa lợi ích kinh tế của đảng viên hoặc người có liên quan với chức trách, nhiệm vụ, quyền hạn và công việc đảng viên thực hiện.","B":"Mối liên hệ giữa khoản đầu tư, lĩnh vực kinh doanh với cơ quan, đơn vị và phạm vi quản lý trực tiếp của đảng viên.","C":"Mối liên hệ giữa lợi ích của người thân thích với các quyết định hành chính, tài chính và thông tin mà đảng viên có khả năng tiếp cận.","D":"Mối liên hệ giữa hình thức đầu tư, mức độ chi phối tổ chức kinh tế với vị trí việc làm và thẩm quyền quản lý của đảng viên."},"ans":"A","s":"Việc nhận diện, đánh giá xung đột lợi ích phải dựa trên mối liên hệ nào?","ref":""},{"doc":"QĐ 224","n":35,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, những loại lợi ích nào phải được xem xét khi nhận diện, đánh giá xung đột lợi ích?","opts":{"A":"Lợi ích tài sản, thu nhập và quyền biểu quyết do đảng viên trực tiếp sở hữu hoặc được ủy quyền.","B":"Lợi ích kinh tế của đảng viên, vợ chồng, cha mẹ, con và tổ chức do các chủ thể này nắm quyền chi phối.","C":"Lợi ích trực tiếp, gián tiếp và thực tế được thụ hưởng, không phụ thuộc người đứng tên tài sản hoặc thực hiện đầu tư.","D":"Lợi ích từ vốn góp, hợp đồng, giao dịch và quyền quản lý có thể định lượng tại thời điểm đánh giá."},"ans":"C","s":"Những loại lợi ích nào phải được xem xét khi nhận diện, đánh giá xung đột lợi ích?","ref":""},{"doc":"QĐ 224","n":36,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, khi phát sinh xung đột lợi ích hoặc khi cấp có thẩm quyền phát hiện và yêu cầu, đảng viên phải làm gì?","opts":{"A":"Báo cáo tổ chức đảng, đề xuất biện pháp tách bạch lợi ích và tiếp tục thực hiện nhiệm vụ theo phân công cho đến khi có quyết định khác.","B":"Báo cáo người đứng đầu cơ quan, kê khai quan hệ lợi ích và chuyển hồ sơ công việc cho cơ quan tham mưu đánh giá mức độ xung đột.","C":"Kịp thời báo cáo cấp có thẩm quyền; không tham gia xử lý công việc có xung đột lợi ích chưa được kiểm soát, trừ trường hợp cấp có thẩm quyền cho phép.","D":"Báo cáo cấp quản lý cán bộ, đề xuất người giám sát độc lập và thực hiện công việc theo cơ chế kiểm soát tăng cường."},"ans":"C","s":"Khi phát sinh xung đột lợi ích hoặc khi cấp có thẩm quyền phát hiện và yêu cầu, đảng viên phải làm gì?","ref":""},{"doc":"QĐ 224","n":37,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, cấp có thẩm quyền có trách nhiệm gì trong kiểm soát xung đột lợi ích?","opts":{"A":"Quyết định biện pháp tương ứng tính chất, mức độ xung đột; theo dõi, giám sát việc chấp hành các biện pháp đã quyết định.","B":"Xác minh thông tin, phân loại mức độ xung đột, yêu cầu đảng viên cam kết khắc phục và tổng hợp kết quả vào đánh giá hằng năm.","C":"Lựa chọn biện pháp phòng ngừa theo vị trí công tác, giao cơ quan tham mưu theo dõi và báo cáo định kỳ tình hình chấp hành.","D":"Xem xét tạm dừng hoặc điều chỉnh nhiệm vụ liên quan, đồng thời đánh giá lại điều kiện tiếp tục hoạt động đầu tư kinh doanh."},"ans":"A","s":"Cấp có thẩm quyền có trách nhiệm gì trong kiểm soát xung đột lợi ích?","ref":""},{"doc":"QĐ 224","n":38,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, việc hướng dẫn, tổ chức thực hiện Quy định trong Quân đội, Công an phải bảo đảm yêu cầu nào?","opts":{"A":"Quân ủy Trung ương, Đảng ủy Công an Trung ương ban hành quy định riêng trên cơ sở nguyên tắc chung, phù hợp chế độ quản lý đặc thù.","B":"Quân ủy Trung ương, Đảng ủy Công an Trung ương hướng dẫn, tổ chức thực hiện Quy định và hướng dẫn của Ban Bí thư, bảo đảm phù hợp với đặc thù của Quân đội, Công an.","C":"Bộ Quốc phòng, Bộ Công an hướng dẫn nghiệp vụ thực hiện, cấp ủy trực thuộc cụ thể hóa theo chức năng và lĩnh vực quản lý.","D":"Cơ quan tổ chức, cán bộ của Quân đội, Công an xây dựng hướng dẫn thống nhất, trình cấp ủy cùng cấp phê duyệt và triển khai."},"ans":"B","s":"Việc hướng dẫn, tổ chức thực hiện Quy định trong Quân đội, Công an phải bảo đảm yêu cầu nào?","ref":""},{"doc":"QĐ 224","n":39,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, hoạt động đầu tư kinh doanh hợp pháp có trước ngày Quy định có hiệu lực và hoạt động sau ngày có hiệu lực được thực hiện như thế nào?","opts":{"A":"Hoạt động có trước tiếp tục theo điều kiện đã được chấp thuận đến hết chu kỳ đầu tư; hoạt động mới áp dụng Quy định từ ngày hiệu lực.","B":"Hoạt động hợp pháp có trước được tiếp tục đến khi pháp luật có quy định khác; hoạt động sau ngày hiệu lực thực hiện theo Quy định này.","C":"Hoạt động có trước được rà soát theo Quy định mới để xác định phần tiếp tục; hoạt động phát sinh sau hiệu lực thực hiện đầy đủ điều kiện mới.","D":"Hoạt động có trước giữ nguyên quyền và nghĩa vụ theo pháp luật tại thời điểm đầu tư; hoạt động mới áp dụng Quy định và hướng dẫn của Ban Bí thư."},"ans":"B","s":"Hoạt động đầu tư kinh doanh hợp pháp có trước ngày Quy định có hiệu lực và hoạt động sau ngày có hiệu lực được thực hiện như thế nào?","ref":""},{"doc":"QĐ 224","n":40,"q":"Theo Quy định số 224-QĐ/TW ngày 14/10/2026 của Ban Chấp hành Trung ương Đảng về đảng viên tham gia hoạt động đầu tư kinh doanh, việc phát hiện, thu hút, bồi dưỡng, trọng dụng đảng viên ngoài khu vực công tiêu biểu để tham gia khu vực công phải gắn với yêu cầu nào?","opts":{"A":"Gắn với quy hoạch và sử dụng cán bộ phù hợp.","B":"Gắn với kiểm soát xung đột lợi ích.","C":"Gắn với chính sách thu hút, đãi ngộ và trọng dụng.","D":"Gắn với thẩm định tiêu chuẩn và uy tín của đảng viên."},"ans":"B","s":"Việc phát hiện, thu hút, bồi dưỡng, trọng dụng đảng viên ngoài khu vực công tiêu biểu để tham gia khu vực công phải gắn với yêu cầu nào?","ref":""},{"doc":"KL 106","n":1,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, tốc độ tăng trưởng GDP 9 tháng đầu năm 2026 của nước ta ước đạt mức nào?","opts":{"A":"Tăng trưởng kinh tế ước đạt 8,15% nhờ sự phục hồi mạnh mẽ của xuất khẩu hàng hóa truyền thống.","B":"Tăng trưởng GDP 9 tháng ước đạt 9,01%, phản ánh sự bứt phá mạnh mẽ của toàn nền kinh tế đất nước.","C":"Tăng trưởng kinh tế đạt 7,85%, cơ bản hoàn thành mục tiêu kế hoạch phát triển kinh tế đề ra đầu năm.","D":"Tăng trưởng GDP ước đạt 9,50%, là mức tăng trưởng kỷ lục cao nhất được ghi nhận từ năm 2021 đến nay."},"ans":"B","s":"Tốc độ tăng trưởng GDP 9 tháng đầu năm 2026 của nước ta ước đạt mức nào?","ref":""},{"doc":"KL 106","n":2,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, tình hình thu ngân sách nhà nước (NSNN) 9 tháng đầu năm 2026 đạt kết quả như thế nào?","opts":{"A":"Ước đạt 1,85 triệu tỉ đồng, bằng 78,5% dự toán pháp lệnh và tăng 8,5% so với cùng kỳ năm trước.","B":"Ước đạt 2,50 triệu tỉ đồng, bằng 92,0% dự toán pháp lệnh và tăng 15,3% so với cùng kỳ năm trước.","C":"Ước đạt khoảng 2,19 triệu tỉ đồng, đạt 86,5% dự toán và tăng 12,1% so với cùng kỳ năm trước.","D":"Ước đạt khoảng 2,05 triệu tỉ đồng, đạt 80,0% dự toán năm và tăng trưởng 10,2% so với cùng kỳ."},"ans":"C","s":"Tình hình thu ngân sách nhà nước (NSNN) 9 tháng đầu năm 2026 đạt kết quả như thế nào?","ref":""},{"doc":"KL 106","n":3,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, số tiền thuế, phí đã thực hiện miễn, giảm, gia hạn trong năm 2026 là khoảng bao nhiêu?","opts":{"A":"Khoảng 250 nghìn tỉ đồng để hỗ trợ các doanh nghiệp công nghệ cao và thúc đẩy sản xuất kinh doanh.","B":"Khoảng 300 nghìn tỉ đồng nhằm giảm bớt gánh nặng chi phí nguyên vật liệu cho thị trường trong nước.","C":"Khoảng 360 nghìn tỉ đồng thuế, phí được miễn, giảm, gia hạn nhằm đồng hành, hỗ trợ doanh nghiệp.","D":"Khoảng 420 nghìn tỉ đồng hỗ trợ phục hồi sức mua của người tiêu dùng và các tổ chức tín dụng."},"ans":"C","s":"Số tiền thuế, phí đã thực hiện miễn, giảm, gia hạn trong năm 2026 là khoảng bao nhiêu?","ref":""},{"doc":"KL 106","n":4,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, kết quả nổi bật trong cải cách thủ tục hành chính năm 2026 được ghi nhận là gì?","opts":{"A":"Đã cắt giảm 45% thời gian và 40% chi phí tuân thủ thủ tục hành chính, điều kiện kinh doanh cả nước.","B":"Đã cắt giảm 53% thời gian, 55% chi phí tuân thủ thủ tục hành chính, vượt yêu cầu Kết luận 18-KL/TW.","C":"Đã cắt giảm 60% thời gian và 50% chi phí tuân thủ thủ tục hành chính của các doanh nghiệp tư nhân.","D":"Đã cắt giảm 50% thời gian và 65% chi phí tuân thủ các quy định kiểm tra chuyên ngành xuất nhập khẩu."},"ans":"B","s":"Kết quả nổi bật trong cải cách thủ tục hành chính năm 2026 được ghi nhận là gì?","ref":""},{"doc":"KL 106","n":5,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, thành tựu quan trọng về hạ tầng giao thông đường bộ đạt được trong năm 2026 là gì?","opts":{"A":"Hoàn thành 250 km đường bộ cao tốc và đưa vào khai thác các tuyến kết nối cửa khẩu biên giới phía Bắc.","B":"Hoàn thành thêm 395 km đường bộ cao tốc, chính thức thông toàn tuyến cao tốc Bắc - Nam phía Đông.","C":"Hoàn thành toàn bộ trục cao tốc Bắc - Nam phía Tây nối liền các tỉnh Tây Nguyên với vùng Nam Bộ.","D":"Khởi công xây dựng mới hơn 500 km đường gom và nâng cấp toàn bộ hệ thống quốc lộ trọng điểm quốc gia."},"ans":"B","s":"Thành tựu quan trọng về hạ tầng giao thông đường bộ đạt được trong năm 2026 là gì?","ref":""},{"doc":"KL 106","n":6,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, dấu ấn nổi bật trong phát triển đường sắt đô thị tại Thủ đô Hà Nội năm 2026 là sự kiện nào?","opts":{"A":"Khánh thành và đưa vào vận hành thương mại đồng loạt 3 tuyến đường sắt kết nối khu đô thị vệ tinh.","B":"Khởi công đồng loạt 5 tuyến đường sắt đô thị tại Hà Nội nhằm mở rộng mạnh mẽ không gian phát triển.","C":"Hoàn thành công tác giải phóng mặt bằng cho toàn bộ 8 tuyến metro theo quy hoạch giao thông Thủ đô.","D":"Phê duyệt báo cáo khả thi tuyến đường sắt liên vùng kết nối Hà Nội với sân bay quốc tế Gia Bình."},"ans":"B","s":"Dấu ấn nổi bật trong phát triển đường sắt đô thị tại Thủ đô Hà Nội năm 2026 là sự kiện nào?","ref":""},{"doc":"KL 106","n":7,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, chính sách phụ cấp đối với cán bộ, công chức cấp xã đã được điều chỉnh như thế nào trong năm 2026?","opts":{"A":"Tăng mức phụ cấp công vụ đối với đội ngũ cán bộ, công chức cấp xã từ mức 20% lên mức 40%.","B":"Tăng phụ cấp đối với cán bộ, công chức cấp xã từ 25% lên 55% nhằm kịp thời động viên cơ sở.","C":"Tăng mức phụ cấp chức vụ lãnh đạo cấp xã từ 30% lên 60% gắn với tinh gọn bộ máy hành chính.","D":"Giữ nguyên mức phụ cấp hiện hưởng nhưng hỗ trợ thêm khoản sinh hoạt phí cố định hằng tháng."},"ans":"B","s":"Chính sách phụ cấp đối với cán bộ, công chức cấp xã đã được điều chỉnh như thế nào trong năm 2026?","ref":""},{"doc":"KL 106","n":8,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, đổi mới mang tính căn bản trong ngành giáo dục bắt đầu áp dụng từ năm học 2026 - 2027 là gì?","opts":{"A":"Bắt buộc chuyển đổi số 100% tài liệu giảng dạy và bãi bỏ toàn bộ việc sử dụng sách in truyền thống.","B":"Sử dụng thống nhất 1 bộ sách giáo khoa từ năm học 2026 - 2027 trên phạm vi toàn bộ các cấp học.","C":"Cho phép mỗi tỉnh, thành phố trực thuộc Trung ương tự biên soạn và phát hành 1 bộ sách giáo khoa riêng.","D":"Tích hợp toàn bộ các môn khoa học xã hội thành một môn học tổng hợp trong chương trình phổ thông."},"ans":"B","s":"Đổi mới mang tính căn bản trong ngành giáo dục bắt đầu áp dụng từ năm học 2026 - 2027 là gì?","ref":""},{"doc":"KL 106","n":9,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, thành tựu trong công tác chăm sóc sức khoẻ nhân dân 8 tháng đầu năm 2026 được thể hiện qua con số nào?","opts":{"A":"Đã tổ chức khám chữa bệnh bảo hiểm y tế định kỳ cho khoảng 40 triệu người dân tại các cơ sở huyện.","B":"Đã khám sức khoẻ định kỳ, sàng lọc miễn phí cho khoảng 52 triệu người tại mạng lưới y tế cơ sở.","C":"Đã tiêm chủng mở rộng miễn phí các loại vắc xin thế hệ mới cho trên 60 triệu người dân toàn quốc.","D":"Đã hoàn thành hồ sơ quản lý sức khỏe điện tử cá nhân cho khoảng 70 triệu công dân trên cả nước."},"ans":"B","s":"Thành tựu trong công tác chăm sóc sức khoẻ nhân dân 8 tháng đầu năm 2026 được thể hiện qua con số nào?","ref":""},{"doc":"KL 106","n":10,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, điểm sáng nổi bật trong công tác đối ngoại và hội nhập quốc tế 9 tháng đầu năm 2026 là gì?","opts":{"A":"Thiết lập quan hệ đối tác chiến lược toàn diện với thêm 10 quốc gia thuộc khu vực Trung Đông.","B":"Tiếp tục nâng cấp quan hệ ngoại giao với 7 đối tác trong 9 tháng, nâng tầm vị thế của Việt Nam.","C":"Hoàn tất đàm phán và ký kết mới 5 hiệp định thương mại tự do thế hệ mới với các nước châu Phi.","D":"Vận động thành công 15 quốc gia công nhận Việt Nam là nền kinh tế thị trường đầy đủ, hoàn thiện."},"ans":"B","s":"Điểm sáng nổi bật trong công tác đối ngoại và hội nhập quốc tế 9 tháng đầu năm 2026 là gì?","ref":""},{"doc":"KL 106","n":11,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, Trung ương nhận định khâu nào vẫn là \"khâu yếu\" trong việc để xảy ra những tồn tại, hạn chế năm 2026?","opts":{"A":"Khâu nghiên cứu lý luận chính trị và hoạch định chủ trương, đường lối chiến lược của Đảng ta.","B":"Tổ chức thực hiện vẫn là khâu yếu, một số cán bộ, người đứng đầu chưa sát sao, còn né tránh.","C":"Khâu thẩm định văn bản pháp luật và rà soát các cam kết hội nhập kinh tế quốc tế song phương.","D":"Khâu thanh tra, kiểm tra tài chính và giám sát kỷ cương của các cơ quan dân cử ở địa phương."},"ans":"B","s":"Trung ương nhận định khâu nào vẫn là \"khâu yếu\" trong việc để xảy ra những tồn tại, hạn chế năm 2026?","ref":""},{"doc":"KL 106","n":12,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, các giải pháp quyết liệt cuối năm 2026 nhằm giảm chi phí xã hội yêu cầu cắt giảm tối đa khâu nào?","opts":{"A":"Cắt giảm các đoàn công tác kiểm tra công vụ liên ngành tại các doanh nghiệp có vốn đầu tư nước ngoài.","B":"Rà soát, cắt giảm tối đa các khâu trung gian trong phân phối xăng dầu, cung ứng điện, sách giáo khoa, thuốc.","C":"Tạm dừng các kỳ họp chuyên đề của Hội đồng nhân dân các cấp nhằm tiết kiệm ngân sách chi thường xuyên.","D":"Bãi bỏ các khâu thẩm định môi trường đối với các dự án xây dựng hạ tầng kỹ thuật đô thị loại đặc biệt."},"ans":"B","s":"Các giải pháp quyết liệt cuối năm 2026 nhằm giảm chi phí xã hội yêu cầu cắt giảm tối đa khâu nào?","ref":""},{"doc":"KL 106","n":13,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, tinh thần, vị thế và sứ mệnh của năm kế hoạch 2027 được Đảng ta xác định là gì?","opts":{"A":"Là năm tiền đề, bản lề để hoàn thành công tác sắp xếp các đơn vị hành chính và ổn định nhân sự.","B":"Là năm tăng tốc, bứt phá, tạo đà, tạo thế, tạo lực để thực hiện thắng lợi Nghị quyết Đại hội XIV.","C":"Là năm tập trung hoàn thành các chỉ tiêu kiềm chế lạm phát và tái cơ cấu nợ công của quốc gia.","D":"Là năm củng cố toàn diện tiềm lực quốc phòng nhằm chủ động ứng phó biến động kinh tế thế giới."},"ans":"B","s":"Tinh thần, vị thế và sứ mệnh của năm kế hoạch 2027 được Đảng ta xác định là gì?","ref":""},{"doc":"KL 106","n":14,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, mục tiêu tăng trưởng kinh tế (GDP) của cả nước đề ra cho năm 2027 là bao nhiêu?","opts":{"A":"Tăng trưởng GDP đạt từ 7,5% đến 8,5% gắn liền với chuyển đổi mô hình kinh tế số toàn diện.","B":"Tăng trưởng kinh tế từ 10% trở lên gắn với giữ vững ổn định vĩ mô, bảo đảm các cân đối lớn.","C":"Tăng trưởng GDP đạt khoảng 8,5% đến 9,0% gắn với việc tăng thu nhập bình quân của người dân.","D":"Phấn đấu tăng trưởng GDP từ 9,0% đến 9,5% nhằm đưa nước ta vào nhóm các nước phát triển."},"ans":"B","s":"Mục tiêu tăng trưởng kinh tế (GDP) của cả nước đề ra cho năm 2027 là bao nhiêu?","ref":""},{"doc":"KL 106","n":15,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, thước đo cao nhất trong điều hành phát triển kinh tế - xã hội năm 2027 được xác định là gì?","opts":{"A":"Mức độ giải ngân nguồn vốn đầu tư công và số lượng dự án trọng điểm được khánh thành hằng năm.","B":"Lấy hiệu quả thực chất, năng suất và đời sống Nhân dân làm thước đo cho các chính sách thực thi.","C":"Quy mô vốn đầu tư trực tiếp nước ngoài và thứ hạng cải cách chỉ số năng lực cạnh tranh cấp tỉnh.","D":"Tỉ lệ tăng thu ngân sách nhà nước và thặng dư thương mại quốc tế đạt được sau mỗi quý làm việc."},"ans":"B","s":"Thước đo cao nhất trong điều hành phát triển kinh tế - xã hội năm 2027 được xác định là gì?","ref":""},{"doc":"KL 106","n":16,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, chỉ tiêu phấn đấu tăng thu NSNN năm 2027 so với thực hiện năm 2026 là khoảng bao nhiêu?","opts":{"A":"Phấn đấu tăng thu ngân sách nhà nước khoảng 7,5% so với mức thực hiện của năm kế hoạch 2026.","B":"Tập trung phấn đấu tăng thu NSNN khoảng 9,1% so với thực hiện năm 2026 và triệt để tiết kiệm chi.","C":"Phấn đấu tăng thu ngân sách nhà nước khoảng 12,0% thông qua việc mở rộng các sắc thuế gián thu mới.","D":"Tăng thu ngân sách khoảng 15,0% nhờ vào nguồn thu đột biến từ thoái vốn doanh nghiệp nhà nước."},"ans":"B","s":"Chỉ tiêu phấn đấu tăng thu NSNN năm 2027 so với thực hiện năm 2026 là khoảng bao nhiêu?","ref":""},{"doc":"KL 106","n":17,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, giải pháp đột phá nào được đề ra nhằm giữ chân và phát huy nguồn lực của các doanh nghiệp FDI?","opts":{"A":"Áp dụng chính sách kiểm soát nghiêm ngặt việc chuyển ngoại tệ ra nước ngoài đối với nhà đầu tư lớn.","B":"Có giải pháp cụ thể khuyến khích doanh nghiệp FDI sử dụng vốn, lợi nhuận chưa chuyển về nước để tái đầu tư.","C":"Buộc các doanh nghiệp FDI phải liên doanh bắt buộc với các tập đoàn nhà nước khi triển khai dự án.","D":"Yêu cầu nộp lưu chiểu toàn bộ các bản quyền công nghệ chế biến chế tạo vào Trung tâm dữ liệu quốc gia."},"ans":"B","s":"Giải pháp đột phá nào được đề ra nhằm giữ chân và phát huy nguồn lực của các doanh nghiệp FDI?","ref":""},{"doc":"KL 106","n":18,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, định hướng đổi mới chính sách đầu tư nước ngoài nhằm khơi thông dòng vốn trung và dài hạn là gì?","opts":{"A":"Bãi bỏ toàn bộ các điều kiện hạn chế tiếp cận thị trường đối với nhà đầu tư tài chính quốc tế.","B":"Sớm triển khai chính sách mở rộng tỉ lệ sở hữu nước ngoài trong các ngành, nghề không ảnh hưởng ANQG.","C":"Cho phép nhà đầu tư nước ngoài sở hữu không giới hạn thời gian đối với toàn bộ đất đai khu công nghiệp.","D":"Miễn thuế thu nhập cá nhân vĩnh viễn cho toàn bộ chuyên gia kỹ thuật người nước ngoài sang làm việc."},"ans":"B","s":"Định hướng đổi mới chính sách đầu tư nước ngoài nhằm khơi thông dòng vốn trung và dài hạn là gì?","ref":""},{"doc":"KL 106","n":19,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, nguyên tắc kỷ luật tài chính kiên quyết thực hiện trong phân bổ và giải ngân vốn đầu tư công năm 2027 là gì?","opts":{"A":"Cho phép tiếp tục giải ngân sang năm sau đối với các dự án chưa đạt khối lượng mà không cần điều chuyển.","B":"Kiên quyết điều chuyển vốn từ nơi giải ngân thấp sang nơi giải ngân tốt; phân bổ theo kết quả đầu ra.","C":"Phân bổ bình quân kinh phí cho toàn bộ các địa phương tự chịu trách nhiệm cân đối đầu tư công.","D":"Tạm đình chỉ nhiệm vụ của người đứng đầu nếu trong quý I chưa giải ngân đạt 50% kế hoạch vốn được giao."},"ans":"B","s":"Nguyên tắc kỷ luật tài chính kiên quyết thực hiện trong phân bổ và giải ngân vốn đầu tư công năm 2027 là gì?","ref":""},{"doc":"KL 106","n":20,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, trách nhiệm trực tiếp của Bí thư tỉnh uỷ, thành uỷ trong năm 2027 được giao là nhiệm vụ nào?","opts":{"A":"Trực tiếp phê duyệt các dự án đầu tư mở rộng diện tích khu công nghiệp tại địa phương mình phụ trách.","B":"Bí thư tỉnh uỷ, thành uỷ trực tiếp chỉ đạo xử lý dứt điểm tình trạng nhà, đất dôi dư sau sắp xếp.","C":"Trực tiếp điều hành ban quản lý các dự án đường bộ cao tốc và đường vành đai đi qua địa bàn tỉnh.","D":"Ký duyệt việc tuyển dụng công chức cấp xã theo chỉ tiêu phân bổ mới của chính quyền địa phương 2 cấp."},"ans":"B","s":"Trách nhiệm trực tiếp của Bí thư tỉnh uỷ, thành uỷ trong năm 2027 được giao là nhiệm vụ nào?","ref":""},{"doc":"KL 106","n":21,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, giải pháp củng cố đội ngũ và tạo động lực cống hiến cho cán bộ, công chức năm 2027 là gì?","opts":{"A":"Bố trí luân chuyển định kỳ toàn bộ công chức chuyên môn từ các sở, ban, ngành về công tác tại cấp xã.","B":"Xây dựng, triển khai hiệu quả cơ chế bảo vệ cán bộ, công chức dám nghĩ, dám làm, dám chịu trách nhiệm.","C":"Áp dụng mức khoán biên chế cố định và tăng gấp đôi phụ cấp công vụ cho cán bộ không giữ chức vụ.","D":"Miễn trừ xử lý hành chính đối với toàn bộ các dự án đầu tư công thực hiện chậm tiến độ do thiếu mặt bằng."},"ans":"B","s":"Giải pháp củng cố đội ngũ và tạo động lực cống hiến cho cán bộ, công chức năm 2027 là gì?","ref":""},{"doc":"KL 106","n":22,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, định hướng phát triển khu vực kinh tế tư nhân năm 2027 theo Nghị quyết 68-NQ/TW chú trọng nội dung nào?","opts":{"A":"Khuyến khích sáp nhập toàn bộ các hộ kinh doanh cá thể vào hệ thống doanh nghiệp nhà nước địa phương.","B":"Tạo mọi điều kiện cho DNTN phát triển, hỗ trợ hộ kinh doanh chuyển đổi, phát triển DN quy mô lớn.","C":"Giới hạn tỷ trọng vốn đăng ký của doanh nghiệp tư nhân nhằm bảo đảm vai trò thống lĩnh của doanh nghiệp nhà nước.","D":"Quy định bắt buộc mọi doanh nghiệp tư nhân mới thành lập phải có đại diện phần vốn của cơ quan nhà nước."},"ans":"B","s":"Định hướng phát triển khu vực kinh tế tư nhân năm 2027 theo Nghị quyết 68-NQ/TW chú trọng nội dung nào?","ref":""},{"doc":"KL 106","n":23,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, những dự án đường sắt quan trọng nào được nhấn mạnh thúc đẩy tiến độ triển khai trong năm 2027?","opts":{"A":"Tuyến đường sắt kết nối khu di tích lịch sử chiến dịch Điện Biên Phủ với mạng lưới đường sắt quốc gia.","B":"Thúc đẩy các dự án đường sắt quan trọng, nhất là tuyến Lào Cai - Hà Nội - Hải Phòng, đường sắt tốc độ cao Bắc - Nam.","C":"Tuyến đường sắt chuyên dùng vận chuyển khoáng sản bauxit kết nối vùng Tây Nguyên với cảng biển Quy Nhơn.","D":"Tuyến đường sắt liên vận quốc tế kết nối hành lang kinh tế Đông - Tây qua cửa khẩu Lao Bảo, Quảng Trị."},"ans":"B","s":"Những dự án đường sắt quan trọng nào được nhấn mạnh thúc đẩy tiến độ triển khai trong năm 2027?","ref":""},{"doc":"KL 106","n":24,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, Trung ương yêu cầu kiên quyết khắc phục tình trạng nào của các địa phương trong đầu tư hạ tầng?","opts":{"A":"Tình trạng các địa phương kéo dài thời gian thương thảo hợp đồng đối tác công tư đối với hạ tầng đường bộ.","B":"Kiên quyết khắc phục tình trạng địa phương đầu tư sân bay, cảng biển, trung tâm dữ liệu... theo phong trào.","C":"Hiện tượng các địa phương không bố trí kinh phí đối ứng cho các dự án hợp tác bảo vệ môi trường biển.","D":"Việc chia nhỏ các gói thầu xây dựng công trình thuỷ lợi nhằm ưu tiên các doanh nghiệp xây dựng của tỉnh."},"ans":"B","s":"Trung ương yêu cầu kiên quyết khắc phục tình trạng nào của các địa phương trong đầu tư hạ tầng?","ref":""},{"doc":"KL 106","n":25,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, mục tiêu phát triển hạ tầng viễn thông, số hoá quốc gia trong năm 2027 gồm nội dung nào?","opts":{"A":"Phủ sóng mạng 4G toàn bộ các thôn bản vùng sâu và thử nghiệm công nghệ vệ tinh định vị độc lập.","B":"Phát triển hạ tầng số; vận hành hiệu quả Trung tâm dữ liệu quốc gia; phủ sóng 5G toàn quốc, chuẩn bị 6G.","C":"Thay thế toàn bộ hệ thống máy chủ của các ngân hàng thương mại bằng thiết bị công nghệ tự chủ trong nước.","D":"Ngắt kết nối các cổng thanh toán quốc tế không đặt văn phòng đại diện thường trú tại Việt Nam."},"ans":"B","s":"Mục tiêu phát triển hạ tầng viễn thông, số hoá quốc gia trong năm 2027 gồm nội dung nào?","ref":""},{"doc":"KL 106","n":26,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, định hướng phát triển năng lực ngoại ngữ trong ngành giáo dục được nêu rõ là gì?","opts":{"A":"Bắt buộc toàn bộ học sinh trung học phổ thông phải đạt chứng chỉ ngoại ngữ quốc tế trước khi xét tốt nghiệp.","B":"Từng bước đưa tiếng Anh thành ngôn ngữ thứ hai trong trường học, gắn liền với đẩy mạnh giáo dục số.","C":"Phổ cập đồng loạt tiếng Anh và tiếng Pháp thành môn học bắt buộc từ bậc giáo dục mầm non trên cả nước.","D":"Áp dụng hình thức giảng dạy song ngữ cho 100% các môn khoa học tự nhiên tại hệ thống trường chuyên."},"ans":"B","s":"Định hướng phát triển năng lực ngoại ngữ trong ngành giáo dục được nêu rõ là gì?","ref":""},{"doc":"KL 106","n":27,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, sự kiện chính trị - xã hội đền ơn đáp nghĩa trọng đại được tổ chức trang trọng trong năm 2027 là gì?","opts":{"A":"Lễ kỷ niệm 50 năm ngày ban hành Pháp lệnh ưu đãi người hoạt động cách mạng và gia đình liệt sĩ.","B":"Tổ chức trang trọng kỷ niệm 80 năm Ngày Thương binh - Liệt sĩ; tập trung cho Chiến dịch 500 ngày đêm.","C":"Tổng kết phong trào \"Toàn dân chăm sóc thương binh, gia đình liệt sĩ\" giai đoạn 2021 - 2026.","D":"Lễ đón nhận danh hiệu vinh dự nhà nước cho các tập thể có công trong công tác quy tập hài cốt liệt sĩ."},"ans":"B","s":"Sự kiện chính trị - xã hội đền ơn đáp nghĩa trọng đại được tổ chức trang trọng trong năm 2027 là gì?","ref":""},{"doc":"KL 106","n":28,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, định hướng chuyển đổi căn bản trong lĩnh vực chăm sóc sức khoẻ nhân dân năm 2027 là gì?","opts":{"A":"Chuyển dịch toàn bộ cơ sở điều trị tuyến huyện sang cơ chế tự chủ hoàn toàn về tài chính và đầu tư.","B":"Chuyển mạnh từ tập trung khám, chữa bệnh sang chủ động phòng bệnh, chăm sóc sức khoẻ toàn diện.","C":"Ưu tiên ngân sách xây dựng các bệnh viện điều trị chuyên khoa hiện đại tại các đô thị loại một.","D":"Thực hiện đấu thầu tập trung quốc tế đối với toàn bộ các nhóm thuốc và vật tư tiêu hao thông thường."},"ans":"B","s":"Định hướng chuyển đổi căn bản trong lĩnh vực chăm sóc sức khoẻ nhân dân năm 2027 là gì?","ref":""},{"doc":"KL 106","n":29,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, chỉ tiêu cụ thể về phát triển nhà ở xã hội phấn đấu hoàn thành trong năm 2027 là bao nhiêu?","opts":{"A":"Hoàn thành vượt mức 120 nghìn căn hộ dành cho công nhân và người có thu nhập thấp đô thị.","B":"Phấn đấu hoàn thành trên 176 nghìn căn hộ (gồm nhà ở xã hội, nhà ở cho thuê, nhà ở công nhân).","C":"Đưa vào sử dụng khoảng 200 nghìn căn hộ thương mại giá rẻ tại các thành phố trực thuộc Trung ương.","D":"Xây dựng mới 150 nghìn phòng ký túc xá miễn phí cho sinh viên và công nhân các khu chế xuất."},"ans":"B","s":"Chỉ tiêu cụ thể về phát triển nhà ở xã hội phấn đấu hoàn thành trong năm 2027 là bao nhiêu?","ref":""},{"doc":"KL 106","n":30,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, nguyên tắc cốt lõi trong khai thác và sử dụng khoáng sản chiến lược năm 2027 là gì?","opts":{"A":"Tăng cường xuất khẩu nguyên liệu thô để tăng nhanh nguồn thu ngân sách bù đắp cho đầu tư công.","B":"Quản lý chặt khoáng sản chiến lược, đẩy mạnh chế biến sâu, tuyệt đối không xuất khẩu thô.","C":"Giao quyền cấp phép thăm dò, khai thác khoáng sản chiến lược vô điều kiện cho Ủy ban nhân dân cấp xã.","D":"Cho phép doanh nghiệp có vốn đầu tư nước ngoài toàn quyền xuất khẩu các sản phẩm khai thác tự do."},"ans":"B","s":"Nguyên tắc cốt lõi trong khai thác và sử dụng khoáng sản chiến lược năm 2027 là gì?","ref":""},{"doc":"KL 106","n":31,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, chủ trương thể chế hoá trong lĩnh vực công nghiệp quốc phòng, an ninh là gì?","opts":{"A":"Tách bạch hoàn toàn giữa dây chuyền sản xuất quân sự và các cơ sở công nghiệp của khu vực dân sự.","B":"Thúc đẩy hợp tác công nghiệp quốc phòng, an ninh và công nghiệp dân sinh; phát triển lưỡng dụng, hiện đại.","C":"Cổ phần hóa toàn bộ các nhà máy cơ khí quốc phòng để thu hút nguồn vốn tư nhân đầu tư vũ khí.","D":"Ngừng mua sắm vũ khí, trang thiết bị từ nước ngoài để tập trung mua sắm các sản phẩm thương mại."},"ans":"B","s":"Chủ trương thể chế hoá trong lĩnh vực công nghiệp quốc phòng, an ninh là gì?","ref":""},{"doc":"KL 106","n":32,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, sự kiện đối ngoại đa phương quy mô quốc tế lớn nhất mà Việt Nam tổ chức năm 2027 là gì?","opts":{"A":"Đăng cai tổ chức thành công Hội nghị Thượng đỉnh Khối ASEAN và các Hội nghị Cấp cao liên quan.","B":"Tổ chức thành công Hội nghị các nhà lãnh đạo Diễn đàn Hợp tác Kinh tế châu Á - Thái Bình Dương (APEC 2027).","C":"Chủ trì Diễn đàn Kinh tế Thế giới về Khu vực Đông Á và Hội nghị Ngoại giao chuyên đề LHQ.","D":"Đăng cai Hội nghị Thượng đỉnh toàn cầu về Ứng phó với Biến đổi Khí hậu và Năng lượng Tái tạo."},"ans":"B","s":"Sự kiện đối ngoại đa phương quy mô quốc tế lớn nhất mà Việt Nam tổ chức năm 2027 là gì?","ref":""},{"doc":"KL 106","n":33,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, chỉ tiêu tốc độ tăng chỉ số giá tiêu dùng (CPI) bình quân năm 2027 được Trung ương đồng ý là bao nhiêu?","opts":{"A":"Tốc độ tăng chỉ số giá tiêu dùng bình quân được duy trì ở mức dưới 3,5%.","B":"Tốc độ tăng chỉ số giá tiêu dùng (CPI) bình quân khoảng 4,5%.","C":"Kiểm soát tốc độ tăng chỉ số giá tiêu dùng bình quân năm ở mức khoảng 5,0%.","D":"Điều hành linh hoạt chỉ số CPI dao động từ 4,0% đến 4,8% tuỳ biến động."},"ans":"B","s":"Chỉ tiêu tốc độ tăng chỉ số giá tiêu dùng (CPI) bình quân năm 2027 được Trung ương đồng ý là bao nhiêu?","ref":""},{"doc":"KL 106","n":34,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, 4 khoản thu thuế nào được xây dựng phương án phân chia tỉ lệ (%) giữa ngân sách trung ương và địa phương?","opts":{"A":"Thuế giá trị gia tăng, thuế tài nguyên, thuế môn bài và tiền sử dụng đất phi nông nghiệp.","B":"Thuế TNDN, thuế TNCN, thuế tiêu thụ đặc biệt và thuế bảo vệ môi trường.","C":"Thuế xuất nhập khẩu, thuế giá trị gia tăng hàng nhập khẩu, thuế thu nhập cá nhân và lệ phí trước bạ.","D":"Thuế sử dụng đất nông nghiệp, thuế thu nhập doanh nghiệp, thuế khoán hộ kinh doanh và phí cầu đường."},"ans":"B","s":"4 khoản thu thuế nào được xây dựng phương án phân chia tỉ lệ (%) giữa ngân sách trung ương và địa phương?","ref":""},{"doc":"KL 106","n":35,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, Trung ương chỉ đạo thực hiện nghiêm quy định nào về tỷ lệ bố trí chi ngân sách cho các ngành?","opts":{"A":"Tăng tỷ lệ % chi cố định đối với các cơ quan hành chính có chức năng thực hiện thủ tục hải quan.","B":"Không ban hành thêm các quy định về tỉ lệ % bố trí chi NSNN cho các ngành, lĩnh vực.","C":"Giao quyền cho từng bộ, ban, ngành tự đề xuất tỷ lệ phân bổ ngân sách tối thiểu cho cơ quan mình.","D":"Bãi bỏ toàn bộ quy định kiểm toán đối với nguồn kinh phí bố trí cho công tác nghiên cứu khoa học."},"ans":"B","s":"Trung ương chỉ đạo thực hiện nghiêm quy định nào về tỷ lệ bố trí chi ngân sách cho các ngành?","ref":""},{"doc":"KL 106","n":36,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, tỷ lệ tiết kiệm chi đầu tư công ngay từ đầu năm 2027 được quy định là bao nhiêu và dùng để làm gì?","opts":{"A":"Tiết kiệm 3% chi đầu tư công để bổ sung vào quỹ khen thưởng thành tích cho các ban quản lý dự án.","B":"Tiết kiệm ngay khi phân bổ ngân sách 5% chi đầu tư công để bổ sung cho các dự án trọng điểm, cấp thiết.","C":"Tiết kiệm 10% chi đầu tư công để chuyển nguồn dự phòng hỗ trợ lãi suất ngân hàng cho doanh nghiệp nhỏ.","D":"Tiết kiệm 7% chi đầu tư công để chi trả các khoản nợ đọng xây dựng cơ bản của các nhiệm kỳ trước."},"ans":"B","s":"Tỷ lệ tiết kiệm chi đầu tư công ngay từ đầu năm 2027 được quy định là bao nhiêu và dùng để làm gì?","ref":""},{"doc":"KL 106","n":37,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW, tỷ lệ tiết kiệm chi thường xuyên ngay khi phân bổ đầu năm 2027 được bổ sung vào nguồn nào?","opts":{"A":"Bổ sung vào quỹ phòng chống lụt bão và cứu trợ khẩn cấp của chính quyền địa phương cấp xã.","B":"Tiết kiệm 10% chi thường xuyên (ngoài tiết kiệm tạo nguồn CCTL...) để bổ sung nguồn chi an sinh xã hội.","C":"Tiết kiệm 15% chi thường xuyên để mua sắm tập trung hệ thống xe ô tô công cho các sở ngành tỉnh.","D":"Tiết kiệm 12% chi thường xuyên để chuyển toàn bộ sang nguồn kinh phí nghiên cứu khoa học cấp nhà nước."},"ans":"B","s":"Tỷ lệ tiết kiệm chi thường xuyên ngay khi phân bổ đầu năm 2027 được bổ sung vào nguồn nào?","ref":""},{"doc":"KL 106","n":38,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), chỉ tiêu GDP bình quân đầu người của nước ta dự kiến năm 2027 là bao nhiêu?","opts":{"A":"Đạt khoảng 5.500 USD gắn với năng suất lao động tăng trưởng nhanh ở khu vực công nghệ cao.","B":"Khoảng 6.100 USD, phản ánh mức cải thiện đáng kể về thu nhập và quy mô nền kinh tế đất nước.","C":"Phấn đấu đạt mức 6.500 USD để hoàn thành mục tiêu nước có thu nhập trung bình cao vượt trội.","D":"Đạt mức 5.800 USD nhằm giữ vững tỷ lệ tích lũy tài sản và tiêu dùng cuối cùng cân bằng."},"ans":"B","s":"Chỉ tiêu GDP bình quân đầu người của nước ta dự kiến năm 2027 là bao nhiêu?","ref":"Phụ lục I"},{"doc":"KL 106","n":39,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), chỉ tiêu tốc độ tăng chỉ số sản xuất công nghiệp (IIP) năm 2027 là bao nhiêu?","opts":{"A":"Đạt từ 9,5% đến 10,5% nhờ vào sự phục hồi của các ngành công nghiệp khai khoáng truyền thống.","B":"Đạt từ 11,5% - 12,5%, phản ánh sự bứt phá của ngành công nghiệp chế biến, chế tạo công nghệ cao.","C":"Phấn đấu tăng từ 13,0% đến 14,0% trên phạm vi toàn bộ các trung tâm công nghiệp lớn của cả nước.","D":"Tăng trưởng đạt khoảng 10,0% đến 11,0% gắn với việc giảm tối đa tỷ lệ tổn thất điện thương phẩm."},"ans":"B","s":"Chỉ tiêu tốc độ tăng chỉ số sản xuất công nghiệp (IIP) năm 2027 là bao nhiêu?","ref":"Phụ lục I"},{"doc":"KL 106","n":40,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), chỉ tiêu tỉ lệ nội địa hoá một số ngành công nghiệp chủ lực năm 2027 là bao nhiêu?","opts":{"A":"Đạt tỷ lệ từ 30% đến 35% trong cơ cấu sản phẩm xe hơi và điện tử gia dụng xuất khẩu chủ lực.","B":"Đạt từ 40 - 42%, nhằm nâng cao tính độc lập, tự chủ và giá trị gia tăng của công nghiệp trong nước.","C":"Phấn đấu đạt tỷ lệ 45% đến 50% thông qua các chương trình hỗ trợ doanh nghiệp tư nhân vừa và nhỏ.","D":"Đạt tỷ lệ trên 55% nhờ chuyển giao công nghệ bắt buộc từ các đối tác liên doanh có vốn FDI."},"ans":"B","s":"Chỉ tiêu tỉ lệ nội địa hoá một số ngành công nghiệp chủ lực năm 2027 là bao nhiêu?","ref":"Phụ lục I"},{"doc":"KL 106","n":41,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), tỉ trọng của ngành công nghiệp chế biến, chế tạo trong GDP năm 2027 là bao nhiêu?","opts":{"A":"Chiếm tỉ trọng 22,5% tổng sản phẩm quốc nội của nền kinh tế nước ta trong năm kế hoạch.","B":"Chiếm tỉ trọng 25,4% trong GDP, giữ vững vai trò là động lực then chốt của toàn bộ nền kinh tế.","C":"Đạt tỉ trọng 28,0% GDP nhờ tăng trưởng mạnh của các nhà máy sản xuất bán dẫn công nghệ mới.","D":"Dự kiến đạt 30,2% GDP gắn liền với tiến trình hiện đại hóa đồng bộ các khu công nghiệp trọng điểm."},"ans":"B","s":"Tỉ trọng của ngành công nghiệp chế biến, chế tạo trong GDP năm 2027 là bao nhiêu?","ref":"Phụ lục I"},{"doc":"KL 106","n":42,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), mục tiêu tăng trưởng giá trị kim ngạch xuất khẩu hàng hoá năm 2027 là bao nhiêu?","opts":{"A":"Tăng trưởng 10% gắn liền với chuyển đổi mô hình logistics hàng không và vận tải container đường sắt.","B":"Tăng trưởng 15%, tiếp tục duy trì đà xuất siêu và đa dạng hoá chuỗi cung ứng với các thị trường lớn.","C":"Tăng trưởng 18% nhờ phát huy hiệu quả các ưu đãi thuế quan từ các hiệp định thương mại tự do.","D":"Phấn đấu tăng khoảng 12% so với giá trị kim ngạch xuất khẩu hàng hóa thực hiện được năm 2026."},"ans":"B","s":"Mục tiêu tăng trưởng giá trị kim ngạch xuất khẩu hàng hoá năm 2027 là bao nhiêu?","ref":"Phụ lục I"},{"doc":"KL 106","n":43,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), chỉ tiêu số lượt khách du lịch quốc tế đến Việt Nam năm 2027 dự kiến đạt mức nào?","opts":{"A":"Đạt khoảng 20 đến 22 triệu lượt khách nhờ đơn giản hóa các điều kiện xuất nhập cảnh và thị thực điện tử.","B":"Đạt từ 28 - 29 triệu lượt khách, khẳng định bước tiến bứt phá của ngành công nghiệp không khói nước ta.","C":"Phấn đấu thu hút 25 triệu lượt khách quốc tế gắn liền với khai thác hiệu quả các đường bay thẳng mới mở.","D":"Đạt khoảng 32 đến 35 triệu lượt khách nhằm đưa Việt Nam vào top 3 điểm đến hàng đầu khu vực châu Á."},"ans":"B","s":"Chỉ tiêu số lượt khách du lịch quốc tế đến Việt Nam năm 2027 dự kiến đạt mức nào?","ref":"Phụ lục I"},{"doc":"KL 106","n":44,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), chỉ tiêu tốc độ tăng năng suất lao động xã hội năm 2027 được giao là bao nhiêu?","opts":{"A":"Tăng trưởng năng suất lao động đạt 7,2% gắn với chuyển đổi cơ cấu việc làm nông thôn sang dịch vụ.","B":"Tốc độ tăng năng suất lao động đạt 8,6%, phản ánh chất lượng tăng trưởng kinh tế ngày càng đi vào chiều sâu.","C":"Đạt tốc độ tăng 9,5% nhờ việc áp dụng phổ biến trí tuệ nhân tạo và chuyển đổi số trong các doanh nghiệp.","D":"Dự kiến đạt mức 6,8% phù hợp với lộ trình đào tạo lại lực lượng lao động qua các chứng chỉ nghề."},"ans":"B","s":"Chỉ tiêu tốc độ tăng năng suất lao động xã hội năm 2027 được giao là bao nhiêu?","ref":"Phụ lục I"},{"doc":"KL 106","n":45,"q":"Trên cơ sở nghiên cứu Kết luận số 106-KL/TW của BCHTW (Phụ lục I), chỉ tiêu tỉ trọng kinh tế số trong GDP năm 2027 phấn đấu đạt mức bao nhiêu?","opts":{"A":"Đạt khoảng 18,5% GDP thông qua việc phát triển thanh toán không dùng tiền mặt trong dân cư.","B":"Khoảng 23,5%, thể hiện sự đóng góp thực chất của công nghệ số và công nghiệp sáng tạo vào nền kinh tế.","C":"Đạt khoảng 28,0% GDP gắn liền với quá trình làm chủ hoàn toàn các công nghệ chiến lược quốc gia.","D":"Phấn đấu đạt mức 30,0% tổng sản phẩm nội địa theo lộ trình Nghị quyết số 57-NQ/TW của Bộ Chính trị."},"ans":"B","s":"Chỉ tiêu tỉ trọng kinh tế số trong GDP năm 2027 phấn đấu đạt mức bao nhiêu?","ref":"Phụ lục I"},{"doc":"KL 106","n":46,"q":"Trên cơ sở nghiên cứu Kết lu
